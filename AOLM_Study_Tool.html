<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AOLM Study Tool</title>
<style>
/* AOLM Study Tool — self-contained, system fonts only */
:root {
  --bg: #F3F0E8;
  --bg-2: #E8E3D6;
  --ink: #1A2422;
  --muted: #3A4A47;
  --card: #FFFcf6;
  --accent: #0D4A43;
  --accent-2: #15685E;
  --accent-soft: #D7EBE7;
  --gold: #6E5210;
  --gold-soft: #F3E6C4;
  --ok: #0C5A38;
  --ok-bg: #D8F0E4;
  --bad: #8A1C1C;
  --bad-bg: #F8DDDD;
  --line: #D0CBBE;
  --focus: #0D4A43;
  --shadow: 0 1px 3px rgba(26, 36, 34, 0.08), 0 8px 24px rgba(26, 36, 34, 0.06);
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 112.5%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.skip {
  position: absolute;
  left: -999px;
  top: 0;
  background: var(--accent);
  color: #fff;
  padding: 0.6rem 1rem;
  z-index: 100;
}
.skip:focus { left: 0.5rem; top: 0.5rem; }
header.app-header {
  background: var(--accent);
  color: #fff;
  padding: 0.75rem 1rem;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header-inner {
  max-width: 56rem;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem 1rem;
}
.brand {
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
  background: none;
  border: 0;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  padding: 0.25rem 0;
  text-align: left;
}
.brand small {
  display: block;
  font-weight: 500;
  font-size: 0.72rem;
  opacity: 0.9;
  letter-spacing: 0;
}
nav.main-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  flex: 1 1 auto;
}
nav.main-nav button {
  background: transparent;
  border: 1px solid transparent;
  color: #fff;
  font: inherit;
  font-size: 0.88rem;
  padding: 0.4rem 0.65rem;
  border-radius: 8px;
  cursor: pointer;
  min-height: 44px;
}
nav.main-nav button:hover { background: rgba(255,255,255,0.12); }
nav.main-nav button[aria-current="page"] {
  background: #fff;
  color: var(--accent);
  font-weight: 700;
}
.header-actions { margin-left: auto; }
.btn-reset {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.55);
  color: #fff;
  font: inherit;
  font-size: 0.85rem;
  padding: 0.4rem 0.7rem;
  border-radius: 8px;
  cursor: pointer;
  min-height: 44px;
}
.btn-reset:hover { background: rgba(255,255,255,0.12); }
main {
  max-width: 56rem;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}
h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 0.75rem; }
h2 { font-size: 1.25rem; margin: 1.4rem 0 0.5rem; }
h3 { font-size: 1.05rem; margin: 1.1rem 0 0.4rem; }
p { margin: 0 0 0.85rem; }
.lead { font-size: 1.05rem; color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}
.topic-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.8rem;
}
@media (min-width: 640px) {
  .topic-grid { grid-template-columns: 1fr 1fr; }
}
.topic-card {
  display: flex;
  flex-direction: column;
  text-align: left;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem;
  box-shadow: var(--shadow);
  cursor: pointer;
  font: inherit;
  color: inherit;
  min-height: 44px;
}
.topic-card:hover { border-color: var(--accent-2); }
.topic-card .num {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.topic-card h2 { margin: 0.15rem 0 0.4rem; font-size: 1.05rem; }
.progress {
  height: 0.7rem;
  background: var(--bg-2);
  border-radius: 99px;
  overflow: hidden;
  margin: 0.35rem 0;
}
.progress > span {
  display: block;
  height: 100%;
  background: var(--accent-2);
  border-radius: 99px;
}
.badge {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 99px;
  margin-top: 0.25rem;
}
.badge-strong { background: var(--ok-bg); color: var(--ok); }
.badge-shaky { background: var(--gold-soft); color: var(--gold); }
.badge-notyet { background: var(--bad-bg); color: var(--bad); }
.badge-plain { background: var(--accent-soft); color: var(--accent); }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin: 1rem 0;
}
.btn {
  font: inherit;
  font-weight: 700;
  border-radius: 10px;
  padding: 0.65rem 1.1rem;
  cursor: pointer;
  min-height: 48px;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: #fff;
}
.btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-secondary {
  background: var(--card);
  color: var(--accent);
}
.btn-secondary:hover { background: var(--accent-soft); }
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.note, .flag, .timer-note {
  background: var(--gold-soft);
  border-left: 4px solid var(--gold);
  padding: 0.75rem 0.9rem;
  border-radius: 0 10px 10px 0;
  margin: 0.9rem 0;
  color: var(--ink);
}
.flag { background: #F8E7D0; }
.lesson p { max-width: 42rem; }
.lesson p + p { margin-top: 0; }
.worked {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  margin: 0.8rem 0 1rem;
}
.worked ol { margin: 0.4rem 0 0; padding-left: 1.2rem; }
.q-meta { color: var(--muted); font-size: 0.88rem; margin-bottom: 0.4rem; }
fieldset.options {
  border: 0;
  padding: 0;
  margin: 0 0 1rem;
}
fieldset.options legend {
  font-weight: 700;
  margin-bottom: 0.6rem;
  padding: 0;
}
.label-opt {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
  margin: 0.4rem 0;
  cursor: pointer;
  min-height: 48px;
}
.label-opt:hover { border-color: var(--accent-2); }
.label-opt:has(input:focus-visible) {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.label-opt input { margin-top: 0.3rem; accent-color: var(--accent); width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
.label-opt.chosen-ok { border-color: var(--ok); background: var(--ok-bg); }
.label-opt.chosen-bad { border-color: var(--bad); background: var(--bad-bg); }
.label-opt.show-right { border-color: var(--ok); background: var(--ok-bg); }
.feedback {
  border-radius: 10px;
  padding: 0.85rem 1rem;
  margin: 0.8rem 0;
}
.feedback.ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad); }
.feedback h3 { margin-top: 0; }
.num-input {
  font: inherit;
  font-size: 1.1rem;
  padding: 0.65rem 0.8rem;
  border-radius: 10px;
  border: 2px solid var(--line);
  width: 100%;
  max-width: 16rem;
  min-height: 48px;
  background: var(--card);
  color: var(--ink);
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  padding: 0.35rem 0.7rem;
  border-radius: 8px;
  display: inline-block;
}
.timer.warn { background: var(--gold); color: #fff; }
.timer.danger { background: var(--bad); }
.crumb { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.5rem; }
.crumb button {
  background: none;
  border: 0;
  color: var(--accent);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  min-height: auto;
}
footer.app-footer {
  max-width: 56rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 2.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--line);
}
.level-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}
.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0;
  border-bottom: 1px solid var(--line);
}
ul.plain { padding-left: 1.2rem; margin: 0.3rem 0 0.8rem; }
ul.plain li { margin: 0.25rem 0; }
.home-hero { margin-bottom: 1.25rem; }

</style>
</head>

<script>
var DATA = {"topics":[{"id":"om","n":1,"title":"OM, mission, strategy and global operations","blurb":"What operations management is, the three essential functions, mission versus strategy, the three routes to competitive advantage, and why firms go global."},{"id":"fc","n":2,"title":"Forecasting","blurb":"What a forecast is, time horizons, qualitative methods, time-series components, and the naive rule. Later quantitative methods are named only — the slides do not give their formulas."},{"id":"pd","n":3,"title":"Product design, life cycle and QFD","blurb":"The product decision, strategy options, the product life cycle diagram, drivers of new products, and quality function deployment."},{"id":"ps","n":4,"title":"Process strategy","blurb":"The four process strategies and how they must fit volume and variety, with the lecture’s hospital, motorcycle, snack and computer examples."},{"id":"cap","n":5,"title":"Capacity, utilisation and efficiency","blurb":"Design capacity, effective capacity and actual output, plus the two formulas and the bakery and Frito-Lay worked examples."},{"id":"scm","n":6,"title":"Supply chain management","blurb":"Why the supply chain matters, how strategy shapes supply-chain choices, sourcing (many versus few suppliers), and risk tactics from the lecture table."},{"id":"qm","n":7,"title":"Quality and TQM","blurb":"What quality means, the costs of quality, TQM ideas that the slides actually explain, the PDCA cycle, inspection and poka-yoke."}],"lessons":{"om":[{"type":"h","text":"What operations management is"},{"type":"p","text":"The lecture defines operations management (OM) as a “disciple” that involves the design, operation and improvement of the systems that create and deliver an organisation’s products and services."},{"type":"flag","text":"The slide uses the word “disciple”. That is almost certainly a typo for “discipline”, but the wording on the slide is “disciple”."},{"type":"p","text":"In everyday terms, OM is how a business actually gets things done. Think of a small café: deciding the menu, running the counter and the kitchen, getting orders out on time, and then finding a less wasteful way to do it next week."},{"type":"p","text":"The lecture’s “operations basics” are: create better products; deliver shipments on time and damage-free; meet customer requirements; provide better service with less effort and cost; use as few resources as needed; and aim for high quality."},{"type":"h","text":"Three essential functions"},{"type":"p","text":"Any organisation, the lecture says, is organised around three essential functions. Marketing generates demand. Production or operations creates the product (or service). Finance and accounting tracks how well the organisation is doing, pays bills and collects money."},{"type":"p","text":"The same three functions show up in the lecture’s organisation charts for a commercial bank, an airline and a manufacturing firm. In a bank, for example, operations includes teller scheduling, cheque clearing and vault operations; marketing includes loans; finance includes investments and securities."},{"type":"h","text":"What operations managers do"},{"type":"p","text":"The basic management functions listed are planning, organising, staffing, leading and controlling. Hiring is not on that list (staffing is)."},{"type":"p","text":"The lecture also lists ten strategic decisions that operations managers handle: design of goods and services; managing quality; process and capacity strategy; location strategy; layout strategy; human resources and job design; supply-chain management; inventory management; scheduling; and maintenance. Later topics in this tool go deeper on some of these; the intro lecture only names them."},{"type":"h","text":"Goods and services"},{"type":"p","text":"A good is tangible — the lecture’s example is the airline seat itself. A service is intangible — a ride in that seat. Services are often produced and consumed at the same time (a haircut), unique to the customer, high in customer interaction, and harder to store, automate or resell. Goods can usually be kept in inventory, tend to be more standardised, and often have some residual value."},{"type":"h","text":"Mission and strategy"},{"type":"p","text":"A mission statement tells the organisation where it is going. It is the organisation’s purpose for being. It answers “What do we contribute to society?” and gives boundaries and focus."},{"type":"p","text":"The strategy tells the organisation how to get there. It is the action plan to achieve the mission. Functional areas each have strategies. Strategies use strengths and opportunities, deal with threats and avoid weaknesses."},{"type":"p","text":"A student analogy: your mission might be “finish my MSc and be useful in operations work”. Your strategy is the plan — which modules to master, how you study, what experience you seek. The lecture is clear that the mission comes first: it is where you are going, and the strategy is how you get there."},{"type":"h","text":"Three approaches to competitive advantage"},{"type":"p","text":"The lecture asks you to identify and explain three approaches: differentiation (better, or at least different), cost leadership (cheaper), and response (more responsive)."},{"type":"p","text":"Differentiation is uniqueness that can go beyond physical features to everything that shapes the customer’s view of value. Lecture examples: Safeskin gloves (leading-edge products), Walt Disney Magic Kingdom (experience differentiation), and Hard Rock Cafe (dining experience)."},{"type":"p","text":"Cost leadership means providing the maximum value as perceived by the customer. The lecture is explicit: this does not imply low quality. Examples: Southwest Airlines (secondary airports, no-frills service, efficient use of equipment) and Walmart (small overhead, shrinkage and distribution costs). A campus shop can compete on cost by keeping a simple range and low waste, without selling poor products."},{"type":"p","text":"Response has three parts in the lecture: flexibility (matching market changes in design innovation and volumes — “a way of life at Hewlett-Packard”); reliability (meeting schedules — the German machine industry); and quickness in design, production and delivery (Johnson Electric, Pizza Hut)."},{"type":"h","text":"Why firms go global"},{"type":"p","text":"The lecture groups six reasons. Tangible reasons: (1) reduce costs (labour, taxes, tariffs, and so on); (2) improve the supply chain; (3) provide better goods and services; (4) understand markets. Intangible reasons: (5) learn to improve operations; (6) attract and retain global talent."},{"type":"p","text":"Examples given include Boeing’s worldwide 787 sales and supply chain, Sony buying components in Thailand, Malaysia and elsewhere, Benetton moving inventory faster through flexible design, production and distribution, Volvo assembled in several countries after Geely’s purchase, and Haier producing in South Carolina for a large share of some US markets."}],"fc":[{"type":"h","text":"What forecasting is"},{"type":"p","text":"Forecasting, the lecture says, is the process of predicting a future event. It is the underlying basis of all business decisions about production, inventory, personnel and facilities."},{"type":"p","text":"A corner shop forecasts so it knows how much bread to order. A student might forecast how many hours a module will take so they can plan the week. The idea is the same: use what you know to look ahead."},{"type":"h","text":"Time horizons"},{"type":"p","text":"Short-range forecasts go up to 1 year, and are generally less than 3 months. They are used for purchasing, job scheduling, workforce levels, job assignments and production levels."},{"type":"p","text":"Medium-range forecasts cover 3 months to 3 years, and support sales and production planning and budgeting. Long-range forecasts are 3+ years, for new product planning, facility location, capital expenditures, and research and development."},{"type":"p","text":"The lecture also notes three differences: medium and long-range forecasts deal with more comprehensive issues and support planning decisions about products, plants and processes; short-term forecasting usually uses different methods from longer-term forecasting; and short-term forecasts tend to be more accurate than longer-term forecasts."},{"type":"h","text":"Types of forecast"},{"type":"p","text":"Economic forecasts address the business cycle — inflation, money supply, housing starts, and so on. Technological forecasts predict the rate of technological progress and affect new product development. Demand forecasts predict sales of existing products and services."},{"type":"p","text":"Forecasts matter strategically for supply-chain management (supplier relations, innovation, cost and speed to market), human resources (hiring, training, lay-offs) and capacity (shortages can mean late delivery and lost customers)."},{"type":"h","text":"Seven steps"},{"type":"p","text":"The lecture’s seven steps, in order, are: (1) determine the use of the forecast; (2) select the items to be forecasted; (3) determine the time horizon of the forecast; (4) select the forecasting model(s); (5) gather the data needed to make the forecast; (6) make the forecast; (7) validate and implement the results."},{"type":"h","text":"Qualitative and quantitative approaches"},{"type":"p","text":"Qualitative methods are used when the situation is vague and little data exist — for example new products or new technology. They involve intuition and experience (the lecture’s example is forecasting sales on the internet)."},{"type":"p","text":"Quantitative methods are used when the situation is ‘stable’ and historical data exist — existing products and current technology. They involve mathematical techniques (the lecture’s example is forecasting sales of colour televisions)."},{"type":"p","text":"Four qualitative methods are taught. A jury of executive opinion pools a small group of high-level experts and managers; it can be combined with statistical models, is relatively quick, and has a ‘group-think’ disadvantage."},{"type":"p","text":"The Delphi method is an iterative group process that continues until consensus is reached. It has three types of participant: decision makers, staff and respondents."},{"type":"p","text":"A sales force composite asks each salesperson to project their sales, then combines the figures at district and national level after a reasonableness review. Sales reps know customers’ wants, but they may be overly optimistic."},{"type":"p","text":"A market survey asks customers about purchasing plans. It is useful for demand and product design, but what people say and what they do may differ, and answers may be overly optimistic."},{"type":"h","text":"Quantitative methods — names only"},{"type":"p","text":"The overview slide lists five quantitative approaches. Naive approach, moving averages, exponential smoothing and trend projection are grouped as time-series models. Linear regression is grouped as an associative model."},{"type":"flag","text":"The slides name moving averages, exponential smoothing, trend projection and linear regression, and say which family each belongs to. They do not give formulas, notation or worked examples for those four methods. This tool will not invent them. If you need the calculations, check with your lecturer or the set Chapter 4 reading."},{"type":"h","text":"Time-series ideas and the naive rule"},{"type":"p","text":"A time series is a set of evenly spaced numerical data, observed at regular time periods. The forecast is based only on past values. It assumes that factors that influenced the past and present will continue to influence the future."},{"type":"p","text":"The four components are trend, seasonal, cyclical and random. Trend is a persistent overall upward or downward pattern, typically lasting several years, driven by things such as population, technology, age or culture."},{"type":"p","text":"Seasonal is a regular up-and-down pattern within a single year, due to weather, customs and the like. The lecture table shows, for example, 7 days in a week, 12 months in a year, and 4 quarters in a year."},{"type":"p","text":"Cyclical movements also repeat, but they last multiple years and are affected by the business cycle, political and economic factors. The lecture says they often have causal or associative relationships. Random is the erratic, unsystematic residual — short, non-repeating, due to random variation or unforeseen events."},{"type":"p","text":"The only numerical forecasting method fully worked in the lecture is the naive approach. It assumes demand in the next period is the same as demand in the most recent period. The lecture’s example: if January sales were 68, then February sales will be 68. It can be cost-effective, efficient, and a good starting point."},{"type":"p","text":"Forecasting in services is said to present unusual challenges: a special need for short-term records, needs that differ by industry and product, holidays and other calendar events, and unusual events. The lecture shows hourly patterns for a fast-food restaurant and a FedEx call centre, but it does not print the individual bar values, so this tool does not treat those heights as given figures."}],"pd":[{"type":"h","text":"The product decision"},{"type":"p","text":"The objective of the product decision, the lecture says, is to develop and implement a product strategy that meets the demands of the marketplace with a competitive advantage."},{"type":"p","text":"Product strategy options are the same three competitive ideas you have already met, with product examples: differentiation (Shouldice Hospital), low cost (Taco Bell), and rapid response (Toyota). A student café might differentiate with a signature sandwich, compete on low cost with a short simple menu, or compete on rapid response by preparing orders unusually quickly."},{"type":"h","text":"The product life cycle"},{"type":"p","text":"A product life cycle may be any length from a few days to decades. The operations function must be able to introduce new products successfully."},{"type":"p","text":"Figure 5.2 labels four phases, in order: Introduction, Growth, Maturity and Decline. It plots cost of development and production and sales revenue against those phases. The area in Introduction is labelled Loss. Profit appears from around late Growth through much of Decline. A small Loss region appears again at the end of Decline. The figure has no numeric values."},{"type":"flag","text":"A StudyNet quiz asked what operations should “focus on” in the decline phase, and what capacity concerns arise in maturity. Figure 5.2 names the phases and shows loss, profit, sales and cost — it does not state those operational focuses. This tool will not guess them. If they come up in class, check with your lecturer (they may be in the Chapter 5 reading, which was not in the uploaded files)."},{"type":"flag","text":"Another StudyNet question asked what percentage of sales from new products is “indicative of industry leaders”. That figure is not in the uploaded lectures, so it is not taught or tested as a fact here."},{"type":"h","text":"Generating new products"},{"type":"p","text":"The lecture lists six items under “Internal structure”: (1) understanding the customer; (2) economic change; (3) sociological and demographic change; (4) technological change; (5) political and legal change; (6) market practice, professional standards, suppliers, distributors."},{"type":"h","text":"Quality function deployment"},{"type":"p","text":"Quality function deployment (QFD) is used to determine what will satisfy the customer, and to translate those customer desires into the target design."},{"type":"p","text":"The house of quality uses a planning matrix to relate customer wants to how the firm is going to meet those wants. The lecture defines these ideas in a few bullets; it does not work a full house-of-quality matrix, so this tool will not invent one."},{"type":"p","text":"Everyday picture: if students tell a campus print shop they want “cheap colour posters, ready the same day”, QFD is the process of turning that wish list into a concrete design — paper stock, machine choice, opening hours — and the house of quality is the planning grid that maps each wish to those “how” decisions."}],"ps":[{"type":"h","text":"What process strategy is for"},{"type":"p","text":"The objective is to create a process that produces offerings that meet customer requirements within cost and other managerial constraints. The choice has long-term effects on efficiency and production flexibility, and on costs and quality."},{"type":"p","text":"The lecture describes four basic strategies: process focus, repetitive focus, product focus, and mass customisation. Within each, there are many ways they may be implemented."},{"type":"h","text":"Fitting volume and variety"},{"type":"p","text":"Figure 7.1 says the process selected must fit with volume and variety. High variety means one or few units per run (it allows customisation). Mid-way, “changes in modules” means modest runs of standardised modules. “Changes in attributes” (grade, quality, size, thickness and so on) goes with long runs only."},{"type":"p","text":"A cell labelled “Poor Strategy” sits at low volume with only attribute changes, and the lecture warns that both fixed and variable costs are high there."},{"type":"h","text":"Process focus"},{"type":"p","text":"Facilities are organised around specific activities or processes. They use general-purpose equipment and skilled personnel, with a high degree of product flexibility. Costs are typically high and equipment utilisation is typically low. Product flows may vary a lot, which makes planning and scheduling a challenge."},{"type":"p","text":"The lecture calls this low-volume, high-variety, intermittent processes. The example is Arnold Palmer Hospital: many inputs (surgeries, sick patients, baby deliveries, emergencies) move through many departments and routings to many different outputs (uniquely treated patients). Job shops, print shops, hospitals and restaurants are also listed here."},{"type":"p","text":"A student parallel: a tutor who designs a different lesson for every learner is running a process-focus style of work — flexible, skilled, and not cheap per person."},{"type":"h","text":"Repetitive focus"},{"type":"p","text":"Facilities are often organised as assembly lines. They are characterised by modules — parts and assemblies made previously — which may be combined for many output options. This is less flexible than process focus, but more efficient."},{"type":"p","text":"The example is Harley-Davidson (modular). Raw materials and module inputs (multiple engines and wheel modules) pass through “few modules”, then modules are combined for many outputs (many combinations of motorcycles). The volume–variety figure also lists autos, motorcycles and home appliances in this band."},{"type":"h","text":"Product focus"},{"type":"p","text":"Facilities are organised by product. Volume is high and variety is low. Long, continuous production runs make the process efficient. Fixed cost is typically high and variable cost typically low. Labour is generally less skilled."},{"type":"p","text":"The example is Frito-Lay: high-volume, low-variety, continuous process. Few inputs (corn, potatoes, water, seasoning) become output variations mainly in size, shape and packaging (3-oz, 5-oz, 24-oz packs labelled for each market). The figure also lists commercial baked goods, steel, glass and beer."},{"type":"h","text":"Mass customisation"},{"type":"p","text":"Mass customisation is the rapid, low-cost production of goods and services to satisfy increasingly unique customer desires. It combines the flexibility of a process focus with the efficiency of a product focus. The figure calls it difficult to achieve, but with huge rewards."},{"type":"p","text":"The example is Dell Computer: high-volume, high-variety. Many part and component inputs (chips, hard drives, software, cases) go through many modules to many output versions (custom PCs and notebooks). The lecture also lists imaginative product design, flexible process design, tightly controlled inventory, tight schedules, and responsive supply-chain partners, under a “high-volume build-to-order” heading."}],"cap":[{"type":"h","text":"What capacity is"},{"type":"p","text":"Capacity is the throughput, or the number of units a facility can hold, receive, store or produce in a period of time. It determines whether demand will be satisfied, and it determines fixed costs. The lecture talks about three time horizons for capacity."},{"type":"p","text":"Think of a campus bakery window. How many rolls it can theoretically turn out in a week, how many it realistically expects to turn out given breaks and changeovers, and how many it actually baked last week, are three different numbers. The lecture gives formal names for those ideas."},{"type":"h","text":"Planning over a time horizon"},{"type":"p","text":"Figure S7.1 splits options into “modify capacity” and “use capacity”."},{"type":"p","text":"Long-range planning can modify capacity by designing new production processes, adding or selling long-lead-time equipment, acquiring or selling facilities, and acquiring competitors. Using capacity at this horizon is marked as difficult, because limited options exist."},{"type":"p","text":"Intermediate-range (aggregate) planning can modify capacity by subcontracting, adding or selling equipment, and adding or reducing shifts. It can use capacity by building or using inventory, more or improved training, and adding or reducing personnel."},{"type":"p","text":"Short-range planning (scheduling) finds it difficult to modify capacity. It uses capacity by scheduling jobs, scheduling personnel, and allocating machinery."},{"type":"h","text":"Design capacity, effective capacity and actual output"},{"type":"p","text":"Design capacity is the maximum theoretical output of a system, normally expressed as a rate. Lecture examples of rates: beds (a hospital), active members (a church), or billable hours (a CPA firm). Table S7.1 adds: ideal conditions exist during the time that the system is available."},{"type":"p","text":"Effective capacity is the capacity a firm expects to achieve given current operating constraints. It is often lower than design capacity. Table S7.1 defines it as design capacity minus lost output because of planned resource unavailability (for example preventive maintenance, machine setups or changeovers, changes in product mix, scheduled breaks)."},{"type":"p","text":"Actual output is effective capacity minus lost output during unplanned resource idleness (for example absenteeism, machine breakdowns, unavailable parts, quality problems)."},{"type":"h","text":"The two formulas"},{"type":"p","text":"Utilisation is the percent of design capacity actually achieved: Utilisation = Actual output / Design capacity."},{"type":"p","text":"Efficiency is the percent of effective capacity actually achieved: Efficiency = Actual output / Effective capacity."},{"type":"p","text":"The formula slide writes these as ratios. The worked bakery example then reports them as percentages. This tool will ask for percentages and will accept a small rounding difference of 0.5 percentage points, because the slides do not state a rounding rule."},{"type":"worked","title":"Frito-Lay example from Table S7.1","steps":["Machines are designed to produce 1,000 bags of chips per hour, and the plant operates 16 hours a day. Design capacity = 1,000 × 16 = 16,000 bags/day.","The firm loses 3 hours of output a day to planned unavailability (0.5 hours preventive maintenance, 1 hour employee breaks, 1.5 hours setting up machines). Effective capacity = 16,000 − (1,000 × 3) = 16,000 − 3,000 = 13,000 bags/day.","On average, machines are not running 1 hour a day because of late parts and breakdowns (unplanned). Actual output = 13,000 − 1,000 = 12,000 bags/day."]},{"type":"worked","title":"Bakery example from the lecture","steps":["Given: actual production last week = 148,000 rolls; effective capacity = 175,000 rolls; design rate = 1,200 rolls per hour; the bakery operates 7 days a week, with three 8-hour shifts.","Design capacity for the week = (7 × 3 × 8) × 1,200 = 168 × 1,200 = 201,600 rolls.","Utilisation = 148,000 / 201,600 = 73.4%.","Efficiency = 148,000 / 175,000 = 84.6%."]},{"type":"h","text":"Capacity, demand and services"},{"type":"p","text":"Capacity decisions affect all ten operations decisions and must be integrated into the organisation’s mission and strategy. Four special considerations are: forecast demand accurately; match technology increments and sales volume; find the optimum operating size (volume); and build for change (flexibility in facilities and equipment)."},{"type":"p","text":"If demand exceeds capacity, managers may curtail demand by raising prices or scheduling longer lead times; the long-term solution is to increase capacity. If capacity exceeds demand, they may stimulate the market or change the product. For seasonal demand, they may produce products with complementary demand patterns."},{"type":"p","text":"Tactics for matching capacity to demand include staffing changes, adjusting equipment (buy more, or sell or lease out what you have), improving processes, redesigning products, adding process flexibility, and closing facilities."},{"type":"p","text":"In services, scheduling customers is demand management, and scheduling the workforce is capacity management. Demand-management examples: appointments (doctors’ and lawyers’ offices); reservations (rental cars, hotels and some restaurants); and the FCFS rule (retail shops, a post office, or a fast-food restaurant). When managing demand is not feasible, capacity is managed with full-time, temporary or part-time staff."}],"scm":[{"type":"h","text":"What the supply chain is for"},{"type":"p","text":"The objective of supply chain management, the lecture says, is to structure the supply chain to maximise its competitive advantage and benefits to the ultimate consumer."},{"type":"p","text":"It is the coordination of all supply-chain activities, starting with raw materials and ending with a satisfied customer. It includes suppliers, manufacturers and/or service providers, distributors, wholesalers, retailers and final customers. A large portion of sales dollars is spent on purchases. Good supply-chain work can improve innovation, speed design and reduce costs."},{"type":"p","text":"Table 11.1 shows supply-chain costs as a percentage of sales in various industries. For example, petroleum 79, automobiles 67, metals 65, restaurants 35. Even a small café is spending a large share of its takings on what it buys in — coffee, milk, cups — which is why the chain of suppliers matters."},{"type":"h","text":"How competitive strategy shapes the chain"},{"type":"p","text":"Table 11.2 links the three strategies you already know to supply-chain choices."},{"type":"p","text":"Under a low-cost strategy, primary supplier selection is about cost; inventory is minimised to hold down costs; distribution uses inexpensive transport and discount distributors or retailers; product design maximises performance and minimises cost."},{"type":"p","text":"Under a response strategy, suppliers are chosen for capacity, speed and flexibility; buffer stocks are used to ensure speedy supply; distribution uses fast transport and premium customer service; product design aims for low setup time and rapid production ramp-up."},{"type":"p","text":"Under a differentiation strategy, suppliers need product-development skills, a willingness to share information, and the ability to jointly and rapidly develop products; inventory is minimised to avoid obsolescence; the distribution network gathers market-research data and uses a knowledgeable sales staff; product design is modular to aid differentiation."},{"type":"h","text":"Sourcing"},{"type":"p","text":"A make-or-buy decision is the choice between obtaining products and services externally and producing them internally. Outsourcing transfers traditional internal activities and resources to outside vendors, seeking efficiency in specialisation and a focus on core competencies."},{"type":"p","text":"The lecture lists six sourcing strategies: many suppliers; few suppliers; vertical integration; joint ventures; keiretsu networks; and virtual companies."},{"type":"p","text":"Many suppliers is commonly used for commodity products. Purchasing is typically based on price. Suppliers compete with one another. The supplier is responsible for technology, expertise, forecasting, cost, quality and delivery."},{"type":"p","text":"With few suppliers, the buyer forms long-term relationships with fewer firms. That can create value through economies of scale and learning-curve improvements. Suppliers are more willing to join JIT programmes and contribute design and technological expertise. But the cost of changing suppliers is huge, and trade secrets and other alliances may be at risk."},{"type":"flag","text":"Vertical integration, joint ventures, keiretsu networks and virtual companies are named on the “six sourcing strategies” slide and are not explained in the uploaded lecture. This tool will only expect you to know that they are on the list — not details the slides do not give."},{"type":"h","text":"Risk and mitigation"},{"type":"p","text":"More reliance on supply chains means more risk. Fewer suppliers increase dependence. Risk is compounded by globalisation and logistical complexity, and includes vendor reliability and quality risks plus political and currency risks."},{"type":"p","text":"Headline tactics: research and assess possible risks; innovative planning; reduce potential disruptions; prepare responses to negative events; build flexible, secure supply chains; and use a diversified supplier base."},{"type":"p","text":"Table 11.3 then pairs specific risks with tactics and examples — for instance, supplier failure to deliver is reduced with multiple suppliers, effective contracts with penalties, subcontractors on retainer and preplanning (the McDonald’s Russia example); natural catastrophes are reduced with insurance, alternate sourcing and cross-country diversification (Toyota seeking at least two suppliers in different regions for each component). Use the practice questions to rehearse those pairings from the table."}],"qm":[{"type":"h","text":"Quality and strategy"},{"type":"p","text":"Managing quality supports differentiation, low-cost and response strategies. Quality helps firms increase sales and reduce costs, which improves profits."},{"type":"p","text":"Sales gains come via improved response, flexible pricing and an improved reputation. Reduced costs come via increased productivity, lower rework and scrap costs, and lower warranty costs."},{"type":"p","text":"The operations manager’s objective is to build a total quality management system that identifies and satisfies customer needs."},{"type":"h","text":"Three views of quality"},{"type":"p","text":"User-based: better performance, more features. Manufacturing-based: conformance to standards, making it right the first time. Product-based: specific and measurable attributes of the product. A phone can be “high quality” because users love its features, because it was built to spec, or because battery life measures well — those are three different views."},{"type":"p","text":"Quality also has implications for company reputation (perception of new products, employment practices, supplier relations), product liability (reducing risk), and global competition."},{"type":"h","text":"Costs of quality"},{"type":"p","text":"The lecture lists four costs. Prevention costs: reducing the potential for defects. Appraisal costs: evaluating products, parts and services. Internal failure costs: producing defective parts or service before delivery. External failure costs: defects discovered after delivery."},{"type":"flag","text":"The slide is titled “Costs of Quality (1 of 2)”, but there is no part 2 in the uploaded deck. This tool only uses the four costs that are listed."},{"type":"h","text":"Total quality management"},{"type":"p","text":"TQM covers the entire organisation from supplier to customer. It stresses a continuing company-wide drive toward excellence in all aspects of products and services that are important to the customer."},{"type":"p","text":"The seven concepts of TQM listed are: continuous improvement; Six Sigma; employee empowerment; benchmarking; just-in-time (JIT); Taguchi concepts; and knowledge of TQM tools."},{"type":"flag","text":"Six Sigma, benchmarking and Taguchi concepts are named on that list and are not explained further in the uploaded slides. This tool will not invent definitions for them."},{"type":"p","text":"Continuous improvement is a never-ending process covering people, equipment, suppliers, materials and procedures. Every operation can be improved. Kaizen describes the ongoing process of unending improvement. TQM and zero defects are also used to describe continuous improvement."},{"type":"p","text":"The PDCA cycle in Figure 6.3, in the lecture’s own words, is: 1. Plan — Identify the problem and make a plan. 2. Do — Test the plan. 3. Check — Is the plan working? 4. Act — Implement the plan, document."},{"type":"p","text":"Employee empowerment means getting employees involved in product and process improvements. The lecture states that 85% of quality problems are due to materials and process. Techniques include communication networks that include employees, open supportive supervisors, moving responsibility to employees, building high morale, and formal team structures."},{"type":"p","text":"JIT is a “pull” system of production scheduling, including supply management: production only when signalled. It allows lower inventory, and inventory both costs money and hides process and material problems. JIT cuts the cost of quality and improves quality; better quality then means less inventory and an easier-to-employ JIT system."},{"type":"h","text":"Tools, inspection and poka-yoke"},{"type":"p","text":"Tools for generating ideas: check sheet, scatter diagram, cause-and-effect diagram. Tools to organise the data: Pareto chart, flowchart (process diagram). Tools for identifying problems: histogram, statistical process control chart."},{"type":"flag","text":"These seven tools are named and grouped, but the slides do not work any examples or calculations. A learning objective says “use” the tools; this tool will only test the names and groups that the lecture actually gives."},{"type":"p","text":"Inspection examines items to see if they are good or defective. It can detect a defective product, but it does not correct deficiencies in the process or product, and it is expensive. Operations needs to know the critical points: when to inspect, and where in the process to inspect."},{"type":"p","text":"The seven listed points are: at the supplier’s plant while the supplier is producing; at your facility upon receipt of goods; before costly or irreversible processes; during the step-by-step production process; when production or service is complete; before delivery to your customer; and at the point of customer contact."},{"type":"p","text":"Source inspection (source control) treats the next step in the process as your customer, and aims to ensure a perfect product to that customer. Poka-yoke is the concept of foolproof devices or techniques designed to pass only acceptable products. Checklists ensure consistency and completeness."},{"type":"p","text":"Everyday picture: a café that uses a lid that will only clip onto the correct cup size is using a poka-yoke idea. A closing-time checklist (fridges shut, till counted, door locked) is the lecture’s “checklist” idea in student life."}]},"questions":[{"id":"om-d1","topic":"om","bank":"diagnose","type":"tf","stem":"A mission statement tells an organisation how to get there.","options":["True","False"],"answer":1,"explainRight":"The lecture says mission statements tell an organisation where it is going. The strategy tells it how to get there.","explainWrong":{"0":"That would describe the strategy, not the mission. Mission = where it is going; strategy = how to get there."}},{"id":"om-d2","topic":"om","bank":"diagnose","type":"mc","stem":"Which of the following is one of the three essential organisational functions named in the lecture?","options":["Human resources as a top-level essential function alongside only marketing","Marketing — generates demand","Research and development — invents patents","Purchasing — places every order"],"answer":1,"explainRight":"The three essential functions are marketing (generates demand), production/operations (creates the product), and finance/accounting (tracks performance, pays bills, collects money).","explainWrong":{"0":"Human resources appears later among the ten strategic decisions (job design), not as one of the three essential functions.","2":"R\u0026D is not one of the three essential functions listed.","3":"Purchasing is not listed as one of the three essential functions."}},{"id":"om-d3","topic":"om","bank":"diagnose","type":"mc","stem":"Competing on cost, according to the lecture, means:","options":["Selling the lowest quality so that the price can be the lowest","Providing the maximum value as perceived by the customer, which does not imply low quality","Never advertising, so overhead stays at zero","Matching unique customer experiences like a theme park"],"answer":1,"explainRight":"The slide says: provide the maximum value as perceived by the customer. It does not imply low quality. Southwest and Walmart are the examples.","explainWrong":{"0":"The lecture is explicit that cost leadership does not imply low quality.","2":"That is not the lecture definition. Walmart and Southwest are about perceived value and efficient operations, not “never advertise”.","3":"A unique theme-park experience is the lecture’s example of experience differentiation, not cost leadership."}},{"id":"om-d4","topic":"om","bank":"diagnose","type":"tf","stem":"One of the lecture’s tangible reasons to globalise is to reduce costs (labour, taxes, tariffs, and so on).","options":["True","False"],"answer":0,"explainRight":"Yes. “Reduce costs (labour, taxes, tariffs, etc.)” is the first tangible reason on the lecture list.","explainWrong":{"1":"It is on the list of tangible reasons to globalise."}},{"id":"om-p101","topic":"om","bank":"practise","type":"tf","stem":"Operations management involves the design, operation and improvement of the systems that create and deliver an organisation’s products and services.","options":["True","False"],"answer":0,"explainRight":"That is the lecture definition (the slide also uses the word “disciple”).","explainWrong":{"1":"That wording is the lecture definition of OM."},"level":1},{"id":"om-p102","topic":"om","bank":"practise","type":"tf","stem":"Finance and accounting’s essential-function role, in the lecture, is to generate demand.","options":["True","False"],"answer":1,"explainRight":"Generating demand is marketing’s role. Finance/accounting tracks how well the organisation is doing, pays bills and collects the money.","explainWrong":{"0":"Generating demand is marketing. Finance/accounting tracks performance, pays bills and collects money."},"level":1},{"id":"om-p103","topic":"om","bank":"practise","type":"mc","stem":"Which set is the lecture’s list of basic management functions?","options":["Planning, organising, staffing, leading, controlling","Hiring, planning, marketing, controlling","Planning, budgeting, hiring, selling, inspecting","Designing, globalising, outsourcing, inspecting"],"answer":0,"explainRight":"The lecture lists planning, organising, staffing, leading and controlling.","explainWrong":{"1":"Hiring is not on the list (staffing is). Marketing is a function of the firm, not one of these five basic management functions.","2":"Budgeting, hiring, selling and inspecting are not the five named functions.","3":"Those words are not the basic management functions list."},"level":1},{"id":"om-p104","topic":"om","bank":"practise","type":"mc","stem":"Which of the following is one of the ten strategic operations decisions listed in the lecture?","options":["Advertising slogan design","Inventory management","Setting the corporate share price","Writing the firm’s tax return"],"answer":1,"explainRight":"Inventory management is on the list of ten strategic decisions, along with quality, capacity, location, layout, supply-chain management, scheduling, maintenance and others.","explainWrong":{"0":"Advertising slogan design is not on the ten-decision list.","2":"Share price is not one of the ten operations decisions.","3":"Tax returns sit with finance/accounting, not on the ten OM decisions list."},"level":1},{"id":"om-p201","topic":"om","bank":"practise","type":"mc","stem":"A student haircut is produced and consumed at the same time and cannot be stored for later. In the lecture’s goods-versus-services table, this is a characteristic of:","options":["Goods, because hair has residual value","Services","Both goods and services equally, in every case","Neither — the lecture says all products are inventory"],"answer":1,"explainRight":"Services are “produced and consumed simultaneously”, with the beauty-salon haircut as the lecture’s example. Goods can usually be kept in inventory.","explainWrong":{"0":"The haircut example is used for services, not goods. Residual value is listed as a characteristic of goods.","2":"The lecture contrasts the two; simultaneous production and consumption is listed under services.","3":"The lecture says goods can usually be kept in inventory; services such as a haircut are consumed as they are produced."},"level":2},{"id":"om-p202","topic":"om","bank":"practise","type":"tf","stem":"In the lecture’s commercial-bank organisation chart, teller scheduling sits under Operations.","options":["True","False"],"answer":0,"explainRight":"Yes. Bank operations includes teller scheduling, cheque clearing, collection, transaction processing, facilities design/layout, vault operations, maintenance and security.","explainWrong":{"1":"Teller scheduling is listed under Operations in the commercial-bank chart."},"level":2},{"id":"om-p203","topic":"om","bank":"practise","type":"mc","stem":"A local café aims to be “better, or at least different”, with a unique dining experience rather than the lowest price. Which of the lecture’s three strategic approaches is that?","options":["Cost leadership","Differentiation","Response as reliability of the weekly schedule only","Outsourcing"],"answer":1,"explainRight":"Differentiation is “better, or at least different”. The lecture’s Hard Rock Cafe example is a dining experience; uniqueness can go beyond physical characteristics to everything that shapes the customer’s view of value.","explainWrong":{"0":"Cost leadership is “cheaper” and is about maximum perceived value, not a unique dining experience.","2":"Response includes flexibility, reliability and quickness, but a unique dining experience is the differentiation example (Hard Rock Cafe).","3":"Outsourcing is a supply-chain topic, not one of the three competitive approaches in the intro lecture."},"level":2},{"id":"om-p204","topic":"om","bank":"practise","type":"tf","stem":"Attracting and retaining global talent is listed as an intangible reason to globalise.","options":["True","False"],"answer":0,"explainRight":"Yes. Reasons 5 and 6 are the intangible ones: learn to improve operations, and attract and retain global talent.","explainWrong":{"1":"It is reason 6, grouped as intangible on the lecture slide."},"level":2},{"id":"om-p301","topic":"om","bank":"practise","type":"mc","stem":"The lecture uses Walt Disney Magic Kingdom as an example of:","options":["Cost leadership through secondary locations","Experience differentiation","A long-range capacity plan","A keiretsu network"],"answer":1,"explainRight":"Under competing on differentiation, the lecture lists “Walt Disney Magic Kingdom – experience differentiation”.","explainWrong":{"0":"Secondary airports are the Southwest (cost leadership) example, not Disney.","2":"The Disney mention is in the differentiation slides, not the capacity chapter.","3":"Keiretsu networks are only named later in the supply-chain lecture, and not in connection with Disney."},"level":3},{"id":"om-p302","topic":"om","bank":"practise","type":"tf","stem":"Competing on response, in the lecture, includes flexibility, reliability of meeting schedules, and quickness in design, production and delivery.","options":["True","False"],"answer":0,"explainRight":"Those are the three bullets on the “Competing on Response” slide, with Hewlett-Packard, the German machine industry, and Johnson Electric / Pizza Hut as the respective examples.","explainWrong":{"1":"All three — flexibility, reliability and quickness — are part of competing on response."},"level":3},{"id":"om-p303","topic":"om","bank":"practise","type":"mc","stem":"Boeing’s 787 is used in the lecture to illustrate:","options":["A purely domestic sales and supply chain","Worldwide sales and supply chain as part of a global view of operations","A market survey forecasting method","Mass customisation at Dell"],"answer":1,"explainRight":"Under global strategies, the lecture says “Boeing 787 – sales and supply chain are worldwide”.","explainWrong":{"0":"The point of the example is that sales and the supply chain are worldwide, not purely domestic.","2":"Market surveys belong to the forecasting lecture.","3":"Dell is the mass-customisation example in the process-strategy lecture."},"level":3},{"id":"om-p304","topic":"om","bank":"practise","type":"tf","stem":"The lecture’s sample operations-management mission is: to produce products consistent with the company’s mission as the worldwide low-cost manufacturer.","options":["True","False"],"answer":0,"explainRight":"That is the “sample operations management mission” on the sample-missions slide, paired with a microwave-communications company mission.","explainWrong":{"1":"That wording is the lecture’s sample OM mission."},"level":3},{"id":"om-p401","topic":"om","bank":"practise","type":"mc","stem":"Which of the following is not one of the lecture’s basic management functions?","options":["Organising","Planning","Hiring","Controlling"],"answer":2,"explainRight":"The five functions are planning, organising, staffing, leading and controlling. Hiring is not on that list.","explainWrong":{"0":"Organising is on the list.","1":"Planning is on the list.","3":"Controlling is on the list."},"level":4},{"id":"om-p402","topic":"om","bank":"practise","type":"tf","stem":"An effective operations management effort must have a strategy so it knows where it is going and a mission so it knows how to get there.","options":["True","False"],"answer":1,"explainRight":"The lecture assigns those roles the other way round: the mission tells the organisation where it is going, and the strategy tells it how to get there.","explainWrong":{"0":"That swaps the lecture definitions. Mission = where it is going; strategy = how to get there."},"level":4},{"id":"om-p403","topic":"om","bank":"practise","type":"mc","stem":"“Experience differentiation”, as used in the intro lecture, is illustrated by:","options":["Walmart’s low distribution costs","Safeskin gloves only, as a low-cost medical supply","Walt Disney Magic Kingdom","A firm that isolates the customer from every service encounter, according to a definition the intro lecture never gives"],"answer":2,"explainRight":"The lecture lists “Walt Disney Magic Kingdom – experience differentiation” under competing on differentiation. It does not give a longer formal definition of the term.","explainWrong":{"0":"Walmart is a cost-leadership example.","1":"Safeskin gloves are “leading edge products” under differentiation, not a low-cost example, and not labelled experience differentiation.","3":"The intro lecture does not define experience differentiation as isolating the customer. It simply uses the Disney (and Hard Rock) experience examples."},"level":4},{"id":"om-p404","topic":"om","bank":"practise","type":"tf","stem":"Improving the supply chain is one of the lecture’s reasons for global operations.","options":["True","False"],"answer":0,"explainRight":"“Improve supply chain” is the second tangible reason to globalise. The lecture also uses Boeing, Sony and Benetton as global supply-chain examples.","explainWrong":{"1":"It is on the list of reasons to globalise."},"level":4},{"id":"om-m1","topic":"om","bank":"mock","type":"mc","stem":"The strategy, in the lecture, is:","options":["The organisation’s purpose for being, which answers what it contributes to society","The action plan to achieve the mission — how the organisation gets there","A list of reasons to avoid weaknesses only, with no link to the mission","The same thing as the mission statement"],"answer":1,"explainRight":"Strategy is the action plan to achieve the mission; it tells the organisation how to get there. The mission is the purpose for being and tells where it is going.","explainWrong":{"0":"That describes the mission, not the strategy.","2":"Strategies do use strengths and opportunities and avoid weaknesses, but the headline definition is the action plan to achieve the mission.","3":"The lecture treats mission and strategy as distinct."}},{"id":"om-m2","topic":"om","bank":"mock","type":"tf","stem":"Cost leadership, as defined in the lecture, implies low quality.","options":["True","False"],"answer":1,"explainRight":"The slide says cost leadership provides maximum value as perceived by the customer and “does not imply low quality”.","explainWrong":{"0":"The lecture is explicit that it does not imply low quality."}},{"id":"om-m3","topic":"om","bank":"mock","type":"mc","stem":"Which of the following is a service characteristic in the lecture’s comparison table?","options":["The product can usually be kept in inventory","Quality is often easy to evaluate, like the strength of a bolt","Produced and consumed simultaneously","The product typically is produced at a fixed facility and often has residual value"],"answer":2,"explainRight":"“Produced and consumed simultaneously” (the haircut example) is listed under characteristics of services.","explainWrong":{"0":"Inventory is listed under goods.","1":"Easy evaluation of quality (strength of a bolt) is listed under goods. Service quality may be hard to evaluate.","3":"A fixed facility and residual value are listed under goods."}},{"id":"fc-d1","topic":"fc","bank":"diagnose","type":"tf","stem":"Short-term forecasts tend to be more accurate than longer-term forecasts, according to the lecture.","options":["True","False"],"answer":0,"explainRight":"The lecture lists this as the third distinguishing difference: short-term forecasts tend to be more accurate than longer-term forecasts.","explainWrong":{"1":"The lecture says the opposite of a “long-range is more accurate” claim: short-term forecasts tend to be more accurate."}},{"id":"fc-d2","topic":"fc","bank":"diagnose","type":"mc","stem":"A forecast used for facility location and capital expenditure, looking 3+ years ahead, is a:","options":["Short-range forecast, generally less than 3 months","Medium-range forecast of 3 months to 3 years","Long-range forecast","Naive forecast only, by definition"],"answer":2,"explainRight":"Long-range forecasts are 3+ years and are used for new product planning, facility location, capital expenditures, and research and development.","explainWrong":{"0":"Short-range is up to 1 year, generally less than 3 months, and is used for purchasing, scheduling, workforce and production levels — not facility location.","1":"Medium-range (3 months to 3 years) is for sales and production planning and budgeting.","3":"Naive is a method, not a time horizon."}},{"id":"fc-d3","topic":"fc","bank":"diagnose","type":"mc","stem":"The first of the lecture’s seven steps in forecasting is:","options":["Make the forecast","Determine the use of the forecast","Select the forecasting model(s)","Validate and implement the results"],"answer":1,"explainRight":"Step 1 is: determine the use of the forecast. Making the forecast is step 6; selecting the model(s) is step 4; validate and implement is step 7.","explainWrong":{"0":"Making the forecast is step 6, not step 1.","2":"Selecting the model(s) is step 4.","3":"Validate and implement the results is step 7."}},{"id":"fc-d4","topic":"fc","bank":"diagnose","type":"tf","stem":"The naive approach assumes that demand in the next period is the same as demand in the most recent period.","options":["True","False"],"answer":0,"explainRight":"That is the lecture definition. The example is: if January sales were 68, then February sales will be 68.","explainWrong":{"1":"That is exactly the naive rule given on the slide."}},{"id":"fc-p101","topic":"fc","bank":"practise","type":"tf","stem":"Forecasting is the process of predicting a future event, and the lecture calls it the underlying basis of all business decisions about production, inventory, personnel and facilities.","options":["True","False"],"answer":0,"explainRight":"Both parts are on the “What is Forecasting?” slide.","explainWrong":{"1":"That is the lecture definition and the “underlying basis” claim."},"level":1},{"id":"fc-p102","topic":"fc","bank":"practise","type":"mc","stem":"A short-range forecast, as defined in the lecture, is:","options":["3+ years ahead","3 months to 3 years","Up to 1 year, generally less than 3 months","Always exactly one week"],"answer":2,"explainRight":"Short-range: up to 1 year, generally less than 3 months. Uses include purchasing, job scheduling, workforce levels, job assignments and production levels.","explainWrong":{"0":"That is the long-range horizon.","1":"That is the medium-range horizon.","3":"The lecture does not define short-range as always one week."},"level":1},{"id":"fc-p103","topic":"fc","bank":"practise","type":"mc","stem":"Which type of forecast “predicts sales of existing products and services”?","options":["Economic forecasts","Technological forecasts","Demand forecasts","Delphi forecasts only"],"answer":2,"explainRight":"Demand forecasts predict sales of existing products and services. Economic forecasts address the business cycle; technological forecasts predict the rate of technological progress.","explainWrong":{"0":"Economic forecasts address the business cycle — inflation, money supply, housing starts, and so on.","1":"Technological forecasts predict the rate of technological progress and affect new product development.","3":"Delphi is a qualitative method, not one of the three forecast types on that slide."},"level":1},{"id":"fc-p104","topic":"fc","bank":"practise","type":"mc","stem":"On the quantitative-approaches slide, linear regression is grouped as:","options":["A time-series model, with the naive approach","An associative model","A qualitative method","A Delphi participant type"],"answer":1,"explainRight":"Naive approach, moving averages, exponential smoothing and trend projection are braced as time-series models. Linear regression is braced as an associative model.","explainWrong":{"0":"The time-series brace covers items 1–4, not linear regression.","2":"Linear regression is listed under quantitative approaches, as an associative model.","3":"Decision makers, staff and respondents are the Delphi participants."},"level":1},{"id":"fc-p201","topic":"fc","bank":"practise","type":"mc","stem":"A brand-new campus start-up has almost no sales history and wants views from a small group of senior managers, combined if needed with a statistical model, quite quickly. Which qualitative method is that closest to?","options":["Market survey only, because customers must be asked","Jury of executive opinion","Sales force composite, because each sales rep is required","Product-focus process strategy"],"answer":1,"explainRight":"A jury of executive opinion involves a small group of high-level experts and managers, can combine managerial experience with statistical models, and is relatively quick. It has a ‘group-think’ disadvantage.","explainWrong":{"0":"A market survey asks customers about purchasing plans, not a small group of senior managers.","2":"A sales force composite aggregates each salesperson’s projection.","3":"Process strategy is a different topic."},"level":2},{"id":"fc-p202","topic":"fc","bank":"practise","type":"tf","stem":"The Delphi method is an iterative group process that continues until consensus is reached, and the lecture names three types of participant: decision makers, staff and respondents.","options":["True","False"],"answer":0,"explainRight":"Both points are on the Delphi slide.","explainWrong":{"1":"That is the lecture description of Delphi."},"level":2},{"id":"fc-p203","topic":"fc","bank":"practise","type":"tf","stem":"A sales force composite and a market survey may both be overly optimistic, according to the lecture.","options":["True","False"],"answer":0,"explainRight":"Both detail slides include “may be overly optimistic”. A market survey also warns that what consumers say and what they actually do may be different.","explainWrong":{"1":"The lecture says this about both methods."},"level":2},{"id":"fc-p204","topic":"fc","bank":"practise","type":"mc","stem":"A seasonal component, as defined in the lecture, occurs:","options":["Over multiple years, driven by the business cycle","Within a single year, as a regular up-and-down pattern","Only randomly, and it never repeats","Only in long-range economic forecasts"],"answer":1,"explainRight":"Seasonal: regular up-and-down pattern, due to weather, customs and so on, occurring within a single year. Cyclical movements last multiple years and are affected by the business cycle.","explainWrong":{"0":"Multiple years and the business cycle describe the cyclical component.","2":"Random is erratic, short and non-repeating. Seasonal is a regular pattern.","3":"Seasonality is a time-series component, not restricted to long-range economic forecasts."},"level":2},{"id":"fc-p301","topic":"fc","bank":"practise","type":"mc","stem":"According to the lecture’s season-length table, a year divided into months has how many “seasons” in the pattern?","options":["4","7","12","52"],"answer":2,"explainRight":"The table row “Year / Month” has 12 seasons in the pattern. 4 is year/quarter, 7 is week/day, 52 is year/week.","explainWrong":{"0":"4 is the number of quarters in a year.","1":"7 is the number of days in a week.","3":"52 is the number of weeks in a year."},"level":3},{"id":"fc-p302","topic":"fc","bank":"practise","type":"tf","stem":"A time-series forecast, in the lecture, is based only on past values, and assumes that factors influencing the past and present will continue to influence the future.","options":["True","False"],"answer":0,"explainRight":"Those are the two core bullets on the time-series forecasting slide.","explainWrong":{"1":"That is the lecture description of time-series forecasting."},"level":3},{"id":"fc-p303","topic":"fc","bank":"practise","type":"mc","stem":"If January sales were 68, the lecture’s naive approach says February sales will be:","options":["136","0","68","Unable to say, because the naive formula was not given"],"answer":2,"explainRight":"The lecture’s example is worded: “If January sales were 68, then February sales will be 68.” The rule is that next period equals the most recent period. No further algebra is written.","explainWrong":{"0":"The naive rule copies the last period; it does not double it.","1":"The naive forecast is 68, not zero.","3":"The lecture does give this worked example in words, even though it does not write an algebraic formula."},"level":3},{"id":"fc-p304","topic":"fc","bank":"practise","type":"mc","stem":"Which step of the seven-step process is “select the forecasting model(s)”?","options":["Step 1","Step 4","Step 6","Step 7"],"answer":1,"explainRight":"The seven steps in order: (1) determine the use; (2) select the items; (3) determine the time horizon; (4) select the forecasting model(s); (5) gather the data; (6) make the forecast; (7) validate and implement.","explainWrong":{"0":"Step 1 is determine the use of the forecast.","2":"Step 6 is make the forecast.","3":"Step 7 is validate and implement the results."},"level":3},{"id":"fc-p401","topic":"fc","bank":"practise","type":"mc","stem":"The fundamental contrast the lecture draws between a seasonal pattern and a cyclical pattern includes which of the following, as actually stated on the slides?","options":["Seasonal patterns occur within a single year; cyclical movements are of multiple years’ duration","The slides state that the only difference is the magnitude of the variation","The slides state that random variation is a type of seasonality","The slides give a formula that converts a cycle into a season"],"answer":0,"explainRight":"Seasonal “occurs within a single year”. Cyclical has “multiple years duration” and is affected by the business cycle, political and economic factors, and often has causal or associative relationships. The slides do not call this “the fundamental difference” in those exact exam words, but the duration contrast is clearly stated.","explainWrong":{"1":"The slides do not say that magnitude of variation is the only difference.","2":"Random is a separate component: erratic, short and non-repeating.","3":"No such formula is given."},"level":4},{"id":"fc-p402","topic":"fc","bank":"practise","type":"tf","stem":"Long-range forecasts are more accurate than short-range forecasts.","options":["True","False"],"answer":1,"explainRight":"The lecture says short-term forecasts tend to be more accurate than longer-term forecasts.","explainWrong":{"0":"That statement reverses the lecture."},"level":4},{"id":"fc-p403","topic":"fc","bank":"practise","type":"mc","stem":"A local bakery says next Monday’s sales will be the same as this Monday’s, because sales have been consistent. Which approach described in the lecture is that?","options":["Delphi method","Market survey","The naive approach","Technological forecasting of the business cycle"],"answer":2,"explainRight":"The naive approach assumes demand in the next period equals demand in the most recent period (January 68, so February 68). A bakery copying last Monday is the same rule.","explainWrong":{"0":"Delphi is an iterative expert panel until consensus.","1":"A market survey asks customers about their plans.","3":"Technological forecasts predict the rate of technological progress; economic forecasts address the business cycle. Neither is this Monday-to-Monday copy."},"level":4},{"id":"fc-p404","topic":"fc","bank":"practise","type":"mc","stem":"Which step involves choosing the model family — for example a time-series model or a qualitative approach?","options":["Validate and implement the results","Select the forecasting model(s)","Determine the time horizon","Gather the data needed to make the forecast"],"answer":1,"explainRight":"Step 4 is “select the forecasting model(s)”. That is the step at which you choose among methods such as the qualitative approaches or the time-series models named on the overview slide.","explainWrong":{"0":"That is step 7, after the forecast has been made.","2":"Determining the time horizon is step 3 (short, medium or long range).","3":"Gathering data is step 5."},"level":4},{"id":"fc-m1","topic":"fc","bank":"mock","type":"mc","stem":"Medium-range forecasts, in the lecture, cover:","options":["Generally less than 3 months, for job scheduling","3 months to 3 years, for sales and production planning and budgeting","3+ years, for capital expenditures","Only one day, for a call-centre roster"],"answer":1,"explainRight":"Medium-range: 3 months to 3 years; sales and production planning, budgeting.","explainWrong":{"0":"That is short-range.","2":"That is long-range.","3":"The lecture does not define medium-range as one day."}},{"id":"fc-m2","topic":"fc","bank":"mock","type":"tf","stem":"Qualitative methods are used when the situation is vague and little data exist, such as new products or new technology.","options":["True","False"],"answer":0,"explainRight":"That is the qualitative-methods slide, which also says they involve intuition and experience.","explainWrong":{"1":"That is the lecture description of when to use qualitative methods."}},{"id":"fc-m3","topic":"fc","bank":"mock","type":"mc","stem":"A “group-think” disadvantage is listed for which qualitative method?","options":["Market survey","Delphi method","Jury of executive opinion","Naive approach"],"answer":2,"explainRight":"The jury of executive opinion slide lists “‘Group-think’ disadvantage”. The naive approach is quantitative (a time-series model).","explainWrong":{"0":"A market survey’s warnings are that words and deeds may differ, and answers may be overly optimistic.","1":"Delphi is described as iterating until consensus; group-think is not the labelled disadvantage there.","3":"Naive is a quantitative time-series approach, not a qualitative method."}},{"id":"pd-d1","topic":"pd","bank":"diagnose","type":"mc","stem":"The objective of the product decision, as stated in the lecture, is to:","options":["Minimise the number of products in every market, with no reference to customers","Develop and implement a product strategy that meets the demands of the marketplace with a competitive advantage","Inspect finished goods only, after delivery","Outsource all design work, always"],"answer":1,"explainRight":"That sentence is the product-decision objective on the slide.","explainWrong":{"0":"The lecture ties the product strategy to marketplace demands and competitive advantage, not to “minimise the number of products” as the objective.","2":"Inspection belongs to the quality lecture, and is not the product-decision objective.","3":"The lecture does not state that all design must be outsourced."}},{"id":"pd-d2","topic":"pd","bank":"diagnose","type":"mc","stem":"Which phase order does Figure 5.2 use for the product life cycle?","options":["Decline, Maturity, Growth, Introduction","Introduction, Growth, Maturity, Decline","Growth, Introduction, Decline, Maturity","Maturity, Introduction, Decline, Growth"],"answer":1,"explainRight":"Figure 5.2 labels Introduction, then Growth, then Maturity, then Decline.","explainWrong":{"0":"That is the reverse of the figure.","2":"Introduction comes first in the figure, not Growth.","3":"That is not the order on Figure 5.2."}},{"id":"pd-d3","topic":"pd","bank":"diagnose","type":"tf","stem":"Quality function deployment (QFD) is used to determine what will satisfy the customer and to translate those desires into the target design.","options":["True","False"],"answer":0,"explainRight":"Those are the two QFD bullets on the lecture slide.","explainWrong":{"1":"That is the lecture definition of QFD."}},{"id":"pd-d4","topic":"pd","bank":"diagnose","type":"mc","stem":"Taco Bell is used in the lecture as an example of which product strategy option?","options":["Differentiation","Low cost","Rapid response","Process focus at a hospital"],"answer":1,"explainRight":"Product strategy options: differentiation — Shouldice Hospital; low cost — Taco Bell; rapid response — Toyota.","explainWrong":{"0":"Shouldice Hospital is the differentiation example.","2":"Toyota is the rapid-response example.","3":"Arnold Palmer Hospital is the process-focus example in the process-strategy lecture, not a Taco Bell product-strategy example."}},{"id":"pd-p101","topic":"pd","bank":"practise","type":"tf","stem":"A product life cycle, the lecture says, may be any length from a few days to decades.","options":["True","False"],"answer":0,"explainRight":"That is the opening bullet on the product life cycle slide.","explainWrong":{"1":"The lecture says it may be any length from a few days to decades."},"level":1},{"id":"pd-p102","topic":"pd","bank":"practise","type":"mc","stem":"Shouldice Hospital is the lecture’s product-strategy example of:","options":["Low cost","Rapid response","Differentiation","Mass customisation at Dell"],"answer":2,"explainRight":"Differentiation — Shouldice Hospital; low cost — Taco Bell; rapid response — Toyota.","explainWrong":{"0":"Low cost is Taco Bell.","1":"Rapid response is Toyota.","3":"Dell is the mass-customisation example in the process-strategy lecture."},"level":1},{"id":"pd-p103","topic":"pd","bank":"practise","type":"mc","stem":"The house of quality, in the lecture, is:","options":["A factory floor plan for Frito-Lay","A planning matrix that relates customer wants to how the firm is going to meet those wants","A type of poka-yoke lid","A long-range capacity option"],"answer":1,"explainRight":"The house of quality “utilise[s] a planning matrix to relate customer wants to how the firm is going to meet those wants”.","explainWrong":{"0":"Frito-Lay is a product-focus process example, not the house of quality.","2":"Poka-yoke is a quality-lecture idea (foolproof devices).","3":"Capacity options are in the capacity lecture, not the definition of the house of quality."},"level":1},{"id":"pd-p104","topic":"pd","bank":"practise","type":"mc","stem":"Which of the following is one of the six items listed under “Generating New Products”?","options":["Understanding the customer","Choosing a poka-yoke checklist only","Setting utilisation equal to efficiency","Acquiring a competitor as a short-range scheduling step"],"answer":0,"explainRight":"The six items start with “Understanding the customer”, then economic, sociological and demographic, technological, political and legal change, and market practice / professional standards / suppliers / distributors.","explainWrong":{"1":"Poka-yoke is from the quality lecture.","2":"Utilisation and efficiency are capacity measures, and they are not usually equal; they are not a new-product driver on this
