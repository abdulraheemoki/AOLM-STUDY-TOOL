    if (correct === 2) return "shaky";
    return "notyet";
  }

  function ratingLabel(r) {
    return r === "strong" ? "Strong" : r === "shaky" ? "Shaky" : "Not yet";
  }

  function practiseProgress(topicId) {
    var all = DATA.questions.filter(function (q) { return q.topic === topicId && q.bank === "practise"; });
    var rec = state.practise[topicId] || {};
    var done = 0, right = 0;
    all.forEach(function (q) {
      if (rec[q.id]) {
        done++;
        if (rec[q.id].correct) right++;
      }
    });
    return { done: done, total: all.length, right: right };
  }

  function diagnoseTopicResults() {
    var res = {};
    DATA.topics.forEach(function (t) {
      var qs = qsFor(t.id, "diagnose");
      var c = 0;
      qs.forEach(function (q) {
        var a = state.diagnose.answers[q.id];
        if (a && a.correct) c++;
      });
      res[t.id] = { correct: c, total: qs.length, rating: state.diagnose.finished ? rating(c, qs.length) : null };
    });
    return res;
  }

  function isCorrect(q, value) {
    if (q.type === "num") {
      var n = parseFloat(String(value).replace(",", ".").trim());
      if (!isFinite(n)) return false;
      var expected = q.answer;
      if (expected >= 1 && n > 0 && n <= 1.0001) n = n * 100;
      var tol = q.tol == null ? 0.5 : q.tol;
      return Math.abs(n - expected) <= tol;
    }
    return value === q.answer;
  }

  function go(view, extra) {
    state.view = view;
    if (extra) Object.keys(extra).forEach(function (k) { state[k] = extra[k]; });
    saveState();
    render();
    window.scrollTo(0, 0);
    var h = document.querySelector("#main h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus(); }
  }

  function confirmReset() {
    if (window.confirm("Reset all saved progress on this device? This cannot be undone.")) {
      try { localStorage.removeItem(STORE); } catch (e) {}
      state = defaultState();
      stopMockTimer();
      announce("Progress has been reset.");
      render();
    }
  }

  function startMockTimer() {
    stopMockTimer();
    mockTick = setInterval(function () {
      if (!state.mock.started || state.mock.submitted) { stopMockTimer(); return; }
      state.mock.remaining -= 1;
      if (state.mock.remaining <= 0) {
        state.mock.remaining = 0;
        state.mock.submitted = true;
        stopMockTimer();
        saveState();
        announce("Time is up. Your mock has been submitted.");
        go("mockResult");
        return;
      }
      if (state.mock.remaining === 300) announce("Five minutes remaining.");
      if (state.mock.remaining === 60) announce("One minute remaining.");
      saveState();
      var t = document.getElementById("mock-timer");
      if (t) {
        t.textContent = formatTime(state.mock.remaining);
        t.className = "timer" + (state.mock.remaining <= 60 ? " danger" : state.mock.remaining <= 300 ? " warn" : "");
      }
    }, 1000);
  }

  function stopMockTimer() {
    if (mockTick) { clearInterval(mockTick); mockTick = null; }
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  /* ---------- views ---------- */

  function header() {
    var views = [
      ["home", "Home"],
      ["diagnose", "Diagnose"],
      ["topics", "My topics"],
      ["mockIntro", "Mock"]
    ];
    var current = state.view;
    if (current === "lesson" || current === "practise") current = "topics";
    if (current === "diagnoseResult") current = "diagnose";
    if (current === "mock" || current === "mockResult") current = "mockIntro";
    return el("header", { className: "app-header" }, [
      el("div", { className: "header-inner" }, [
        el("button", { className: "brand", type: "button", onclick: function () { go("home"); } }, [
          "AOLM Study Tool",
          el("small", { text: "Analytics for Operations and Logistics Management" })
        ]),
        el("nav", { className: "main-nav", "aria-label": "Main" }, views.map(function (v) {
          return el("button", {
            type: "button",
            "aria-current": current === v[0] ? "page" : null,
            onclick: function () {
              if (v[0] === "diagnose") go(state.diagnose.finished ? "diagnoseResult" : "diagnoseStart");
              else go(v[0]);
            },
            text: v[1]
          });
        })),
        el("div", { className: "header-actions" }, [
          el("button", { type: "button", className: "btn-reset", onclick: confirmReset, text: "Reset my progress" })
        ])
      ])
    ]);
  }

  function footer() {
    return el("footer", { className: "app-footer" }, [
      el("p", { text: "Built from module slides and StudyNet quizzes. Not official. Check anything flagged with your lecturer." })
    ]);
  }

  function viewHome() {
    return [
      el("div", { className: "home-hero" }, [
        el("h1", { text: "Study the module, one idea at a time" }),
        el("p", { className: "lead", text: "A practice tool for Analytics for Operations and Logistics Management. Lessons and questions are built only from your lecture slides and StudyNet quizzes — nothing invented." }),
        el("div", { className: "actions" }, [
          el("button", { type: "button", className: "btn", onclick: function () { go(state.diagnose.finished ? "diagnoseResult" : "diagnoseStart"); }, text: state.diagnose.finished ? "Review diagnosis" : "Start diagnosis" }),
          el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("topics"); }, text: "My topics" }),
          el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("mockIntro"); }, text: "Timed mock" })
        ]),
        el("p", { className: "note", text: "Progress is saved only on this device (in your browser). Use Reset my progress to start again. The real exam time limit is not stated in the module materials." })
      ]),
      el("h2", { text: "Topic map" }),
      topicGrid(true)
    ];
  }

  function topicGrid(linkToTopic) {
    var diag = diagnoseTopicResults();
    return el("div", { className: "topic-grid" }, DATA.topics.map(function (t) {
      var p = practiseProgress(t.id);
      var pct = p.total ? Math.round(100 * p.done / p.total) : 0;
      var r = diag[t.id] && diag[t.id].rating;
      var kids = [
        el("div", { className: "num", text: "Topic " + t.n }),
        el("h2", { text: t.title }),
        el("div", { className: "progress", "aria-hidden": "true" }, [el("span", { style: "width:" + pct + "%" })]),
        el("div", { text: "Practise " + p.done + " of " + p.total + (p.done ? " (" + p.right + " correct)" : "") })
      ];
      if (r) kids.push(el("span", { className: "badge badge-" + r, text: "Diagnose: " + ratingLabel(r) }));
      if (linkToTopic) {
        return el("button", { type: "button", className: "topic-card", onclick: function () { go("topic", { topicId: t.id }); } }, kids);
      }
      return el("div", { className: "topic-card" }, kids);
    }));
  }

  function viewDiagnoseStart() {
    return [
      el("h1", { text: "Diagnose what you already know" }),
      el("p", { text: "A short quiz — 4 questions on each of the 7 topics (28 in total). At the end you will see Strong, Shaky or Not yet for every topic, and a link to the lesson." }),
      el("p", { text: "This is not the real exam. There is no timer here." }),
      el("div", { className: "actions" }, [
        el("button", { type: "button", className: "btn", onclick: function () {
          state.diagnose = { index: 0, answers: {}, finished: false };
          saveState();
          go("diagnose");
        }, text: "Begin diagnosis" }),
        el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("home"); }, text: "Back to home" })
      ])
    ];
  }

  function viewDiagnose() {
    var list = diagnoseQs();
    var i = state.diagnose.index || 0;
    if (i >= list.length) return viewDiagnoseResult();
    var q = list[i];
    var t = topicById(q.topic);
    return [
      el("p", { className: "crumb" }, [
        el("button", { type: "button", onclick: function () { go("diagnoseStart"); }, text: "Diagnose" }),
        " · Question " + (i + 1) + " of " + list.length + " · " + t.title
      ]),
      el("h1", { text: "Diagnosis" }),
      questionBlock(q, state.diagnose.answers[q.id], function (val) {
        var rec = { value: val, correct: isCorrect(q, val) };
        state.diagnose.answers[q.id] = rec;
        saveState();
        render();
        announce(rec.correct ? "Correct." : "Not quite.");
      }, function () {
        if (i + 1 >= list.length) {
          state.diagnose.finished = true;
          saveState();
          go("diagnoseResult");
        } else {
          state.diagnose.index = i + 1;
          saveState();
          go("diagnose");
        }
      }, i + 1 >= list.length ? "See my results" : "Next question")
    ];
  }

  function viewDiagnoseResult() {
    var res = diagnoseTopicResults();
    return [
      el("h1", { text: "Your diagnosis" }),
      el("p", { text: "Strong means you got 3 or 4 questions right in that topic; Shaky means 2; Not yet means 0 or 1. Use this to choose which lesson to open first." }),
      el("div", { className: "card" }, DATA.topics.map(function (t) {
        var r = res[t.id];
        return el("div", { className: "score-row" }, [
          el("div", null, [
            el("strong", { text: t.n + ". " + t.title }),
            el("div", { text: r.correct + " out of " + r.total + " correct" })
          ]),
          el("div", null, [
            el("span", { className: "badge badge-" + r.rating, text: ratingLabel(r.rating) }),
            " ",
            el("button", { type: "button", className: "btn btn-secondary", style: "min-height:40px;padding:0.3rem 0.7rem;margin-left:0.4rem", onclick: function () { go("lesson", { topicId: t.id }); }, text: "Lesson" })
          ])
        ]);
      })),
      el("div", { className: "actions" }, [
        el("button", { type: "button", className: "btn", onclick: function () { go("topics"); }, text: "Go to My topics" }),
        el("button", { type: "button", className: "btn btn-secondary", onclick: function () {
          if (window.confirm("Retake the diagnosis? Your previous diagnosis results will be cleared.")) {
            state.diagnose = { index: 0, answers: {}, finished: false };
            saveState();
            go("diagnose");
          }
        }, text: "Retake diagnosis" })
      ])
    ];
  }

  function viewTopics() {
    return [
      el("h1", { text: "My topics" }),
      el("p", { text: "Open a lesson, then practise in four levels: recall, apply, exam style, and mock style." }),
      topicGrid(true)
    ];
  }

  function viewTopic() {
    var t = topicById(state.topicId);
    if (!t) return viewTopics();
    var p = practiseProgress(t.id);
    var diag = diagnoseTopicResults()[t.id];
    return [
      el("p", { className: "crumb" }, [
        el("button", { type: "button", onclick: function () { go("topics"); }, text: "My topics" }),
        " · Topic " + t.n
      ]),
      el("h1", { text: t.title }),
      el("p", { text: t.blurb }),
      p.total ? el("p", { text: "Practise progress: " + p.done + " of " + p.total + " questions attempted (" + p.right + " correct so far)." }) : null,
      diag && diag.rating ? el("p", null, [el("span", { className: "badge badge-" + diag.rating, text: "Diagnose: " + ratingLabel(diag.rating) })]) : null,
      el("div", { className: "actions" }, [
        el("button", { type: "button", className: "btn", onclick: function () { go("lesson", { topicId: t.id }); }, text: "Open lesson" })
      ]),
      el("h2", { text: "Practise" }),
      el("div", { className: "level-row" }, [1, 2, 3, 4].map(function (lv) {
        var qs = practiseQs(t.id, lv);
        var rec = state.practise[t.id] || {};
        var done = qs.filter(function (q) { return rec[q.id]; }).length;
        var labels = { 1: "Level 1 · Recall", 2: "Level 2 · Apply", 3: "Level 3 · Exam style", 4: "Level 4 · Mock style" };
        return el("button", {
          type: "button",
          className: "btn btn-secondary",
          onclick: function () { state.qIndex = 0; go("practise", { topicId: t.id, level: lv, qIndex: 0 }); },
          text: labels[lv] + " (" + done + "/" + qs.length + ")"
        });
      }))
    ];
  }

  function viewLesson() {
    var t = topicById(state.topicId);
    if (!t) return viewTopics();
    state.lessonsSeen[t.id] = true;
    saveState();
    var lesson = DATA.lessons[t.id];
    var idx = DATA.topics.indexOf(t);
    var kids = [
      el("p", { className: "crumb" }, [
        el("button", { type: "button", onclick: function () { go("topics"); }, text: "My topics" }),
        " · ",
        el("button", { type: "button", onclick: function () { go("topic", { topicId: t.id }); }, text: t.title }),
        " · Lesson"
      ]),
      el("h1", { text: t.title })
    ];
    lesson.forEach(function (block) {
      if (block.type === "h") kids.push(el("h2", { text: block.text }));
      else if (block.type === "p") kids.push(el("p", { text: block.text }));
      else if (block.type === "ul") kids.push(el("ul", { className: "plain" }, block.items.map(function (it) { return el("li", { text: it }); })));
      else if (block.type === "flag") kids.push(el("p", { className: "flag" }, [el("strong", { text: "Check with your lecturer. " }), block.text]));
      else if (block.type === "worked") {
        kids.push(el("div", { className: "worked" }, [
          el("strong", { text: block.title || "Worked example (from the lecture)" }),
          el("ol", null, block.steps.map(function (s) { return el("li", { text: s }); }))
        ]));
      }
    });
    kids.push(el("div", { className: "actions" }, [
      el("button", { type: "button", className: "btn", onclick: function () { go("practise", { topicId: t.id, level: 1, qIndex: 0 }); }, text: "Practise this topic" }),
      idx > 0 ? el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("lesson", { topicId: DATA.topics[idx - 1].id }); }, text: "Previous topic" }) : null,
      idx < DATA.topics.length - 1 ? el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("lesson", { topicId: DATA.topics[idx + 1].id }); }, text: "Next topic" }) : null
    ]));
    return kids;
  }

  function viewPractise() {
    var t = topicById(state.topicId);
    var qs = practiseQs(state.topicId, state.level);
    if (!t || !qs.length) return viewTopic();
    var i = state.qIndex || 0;
    if (i < 0) i = 0;
    if (i >= qs.length) i = qs.length - 1;
    var q = qs[i];
    var rec = (state.practise[t.id] || {})[q.id];
    var labels = { 1: "Level 1 · Recall", 2: "Level 2 · Apply", 3: "Level 3 · Exam style", 4: "Level 4 · Mock style" };
    return [
      el("p", { className: "crumb" }, [
        el("button", { type: "button", onclick: function () { go("topic", { topicId: t.id }); }, text: t.title }),
        " · " + labels[state.level] + " · Question " + (i + 1) + " of " + qs.length
      ]),
      el("h1", { text: labels[state.level] }),
      questionBlock(q, rec, function (val) {
        if (!state.practise[t.id]) state.practise[t.id] = {};
        state.practise[t.id][q.id] = { value: val, correct: isCorrect(q, val) };
        saveState();
        render();
        announce(state.practise[t.id][q.id].correct ? "Correct." : "Not quite.");
      }, function () {
        if (i + 1 >= qs.length) go("topic", { topicId: t.id });
        else { state.qIndex = i + 1; saveState(); go("practise"); }
      }, i + 1 >= qs.length ? "Back to topic" : "Next question")
    ];
  }

  function viewMockIntro() {
    return [
      el("h1", { text: "Timed mock" }),
      el("p", { text: "21 questions, mixed across all seven topics, 1 point each. You have 25 minutes." }),
      el("p", { className: "timer-note", text: "The real exam time limit is not stated in the module materials. 25 minutes is a study default for this practice paper, not an official rule." }),
      el("p", { text: "The questions follow the style of the StudyNet quizzes (true/false and multiple choice), plus a few capacity calculations like the lecture examples. This is not an official past paper." }),
      state.mock.started && !state.mock.submitted ? el("p", { text: "You have a mock in progress (" + formatTime(state.mock.remaining) + " left)." }) : null,
      el("div", { className: "actions" }, [
        el("button", { type: "button", className: "btn", onclick: function () {
          var order = DATA.questions.filter(function (q) { return q.bank === "mock"; }).map(function (q) { return q.id; });
          state.mock = { started: true, remaining: MOCK_SECONDS, answers: {}, submitted: false, order: order, index: 0 };
          saveState();
          go("mock");
        }, text: state.mock.started && !state.mock.submitted ? "Restart mock" : "Start 25-minute mock" }),
        state.mock.started && !state.mock.submitted ? el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("mock"); }, text: "Continue in-progress mock" }) : null,
        state.mock.submitted ? el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("mockResult"); }, text: "View last results" }) : null
      ])
    ];
  }

  function mockList() {
    var map = {};
    DATA.questions.forEach(function (q) { if (q.bank === "mock") map[q.id] = q; });
    return (state.mock.order || []).map(function (id) { return map[id]; }).filter(Boolean);
  }

  function viewMock() {
    if (!state.mock.started) return viewMockIntro();
    if (state.mock.submitted) return viewMockResult();
    var list = mockList();
    var i = state.mock.index || 0;
    if (i >= list.length) i = list.length - 1;
    var q = list[i];
    var rec = state.mock.answers[q.id];
    return [
      el("p", { className: "crumb" }, [
        "Mock · Question " + (i + 1) + " of " + list.length + " · ",
        el("span", {
          id: "mock-timer",
          className: "timer" + (state.mock.remaining <= 60 ? " danger" : state.mock.remaining <= 300 ? " warn" : ""),
          "aria-label": "Time remaining",
          text: formatTime(state.mock.remaining)
        })
      ]),
      el("h1", { text: "Timed mock" }),
      questionBlock(q, rec, function (val) {
        state.mock.answers[q.id] = { value: val, correct: isCorrect(q, val) };
        saveState();
        render();
        announce(state.mock.answers[q.id].correct ? "Correct." : "Not quite.");
      }, function () {
        if (i + 1 >= list.length) {
          state.mock.submitted = true;
          stopMockTimer();
          saveState();
          go("mockResult");
        } else {
          state.mock.index = i + 1;
          saveState();
          go("mock");
        }
      }, i + 1 >= list.length ? "Submit mock" : "Next question")
    ];
  }

  function viewMockResult() {
    var list = mockList();
    var byT = {};
    var total = 0, right = 0;
    list.forEach(function (q) {
      if (!byT[q.topic]) byT[q.topic] = { total: 0, right: 0 };
      byT[q.topic].total++;
      total++;
      if (state.mock.answers[q.id] && state.mock.answers[q.id].correct) {
        byT[q.topic].right++;
        right++;
      }
    });
    return [
      el("h1", { text: "Mock results" }),
      el("p", { text: "You scored " + right + " out of " + total + " (" + (total ? Math.round(100 * right / total) : 0) + "%)." }),
      el("p", { className: "note", text: "This is a study mock, not an official mark. The real exam time limit and paper format are not stated in the materials you uploaded." }),
      el("h2", { text: "Breakdown by topic" }),
      el("div", { className: "card" }, DATA.topics.map(function (t) {
        var r = byT[t.id] || { total: 0, right: 0 };
        return el("div", { className: "score-row" }, [
          el("div", null, [el("strong", { text: t.n + ". " + t.title }), el("div", { text: r.right + " / " + r.total })]),
          el("button", { type: "button", className: "btn btn-secondary", style: "min-height:40px;padding:0.3rem 0.7rem", onclick: function () { go("lesson", { topicId: t.id }); }, text: "Review lesson" })
        ]);
      })),
      el("div", { className: "actions" }, [
        el("button", { type: "button", className: "btn btn-secondary", onclick: function () { go("home"); }, text: "Home" })
      ])
    ];
  }

  function questionBlock(q, rec, onSubmit, onNext, nextLabel) {
    var locked = !!(rec && rec.value !== undefined && rec.value !== null && rec.value !== "");
    if (q.type === "num") locked = !!(rec && rec.value !== undefined && rec.value !== null && String(rec.value) !== "");
    var wrap = el("div", { className: "card" }, [
      el("p", { className: "q-meta", text: (q.type === "tf" ? "True or False" : q.type === "num" ? "Numeric" : "Multiple choice") + " · 1 point" }),
      el("fieldset", { className: "options" }, [el("legend", { text: q.stem })].concat(fields(q, rec, locked))),
      q.hint ? el("p", { className: "note", text: q.hint }) : null
    ]);
    if (!locked) {
      var submit = el("button", { type: "button", className: "btn", text: "Check answer" });
      submit.addEventListener("click", function () {
        var val = readAnswer(q, wrap);
        if (val === undefined || val === null || val === "") {
          announce("Please choose an answer first.");
          return;
        }
        onSubmit(val);
      });
      wrap.appendChild(el("div", { className: "actions" }, [submit]));
    } else {
      wrap.appendChild(feedbackEl(q, rec));
      var next = el("button", { type: "button", className: "btn", text: nextLabel || "Next" });
      next.addEventListener("click", onNext);
      wrap.appendChild(el("div", { className: "actions" }, [next]));
    }
    return wrap;
  }

  function fields(q, rec, locked) {
    if (q.type === "num") {
      var inp = el("input", {
        type: "text",
        className: "num-input",
        inputmode: "decimal",
        id: "ans-" + q.id,
        "aria-label": "Your numeric answer" + (q.unit ? " in " + q.unit : ""),
        value: rec && rec.value != null ? String(rec.value) : "",
        disabled: locked
      });
      var lab = el("label", { "for": "ans-" + q.id, text: q.unit ? "Enter your answer" + (q.unit === "%" ? " as a percentage (for example 73.4)" : " (" + q.unit + ")") : "Enter your answer" });
      return [lab, inp];
    }
    var opts = q.options || ["True", "False"];
    return opts.map(function (lab, i) {
      var cls = "label-opt";
      if (locked) {
        if (i === q.answer) cls += " show-right";
        if (rec && rec.value === i && i !== q.answer) cls += " chosen-bad";
        if (rec && rec.value === i && i === q.answer) cls += " chosen-ok";
      }
      return el("label", { className: cls }, [
        el("input", { type: "radio", name: "ans-" + q.id, value: String(i), checked: rec && rec.value === i, disabled: locked }),
        el("span", { text: lab })
      ]);
    });
  }

  function readAnswer(q, wrap) {
    if (q.type === "num") {
      var inp = wrap.querySelector("input.num-input");
      return inp ? inp.value : "";
    }
    var sel = wrap.querySelector("input[type=radio]:checked");
    if (!sel) return null;
    return parseInt(sel.value, 10);
  }

  function feedbackEl(q, rec) {
    var ok = rec && rec.correct;
    var box = el("div", { className: "feedback " + (ok ? "ok" : "bad"), "aria-live": "polite" }, [
      el("h3", { text: ok ? "Correct" : "Not quite" })
    ]);
    if (q.explainRight) box.appendChild(el("p", { text: q.explainRight }));
    if (!ok && rec) {
      var wx;
      if (q.type === "num") {
        wx = q.explainWrongNum || ("The lecture method gives " + q.answer + (q.unit || "") + ". Close answers within 0.5 percentage points are accepted.");
      } else if (q.explainWrong && q.explainWrong[String(rec.value)]) {
        wx = q.explainWrong[String(rec.value)];
      } else if (q.explainWrong && q.explainWrong[rec.value]) {
        wx = q.explainWrong[rec.value];
      }
      if (wx) box.appendChild(el("p", { text: wx }));
    }
    if (q.working && q.working.length) {
      box.appendChild(el("p", { text: "Working:" }));
      box.appendChild(el("ol", null, q.working.map(function (s) { return el("li", { text: s }); })));
    }
    if (q.flag) box.appendChild(el("p", { className: "flag", text: q.flag }));
    return box;
  }

  function render() {
    if (state.view === "mock" && state.mock.started && !state.mock.submitted) startMockTimer();
    else stopMockTimer();

    var view = state.view;
    var body;
    if (view === "home") body = viewHome();
    else if (view === "diagnoseStart") body = viewDiagnoseStart();
    else if (view === "diagnose") body = viewDiagnose();
    else if (view === "diagnoseResult") body = viewDiagnoseResult();
    else if (view === "topics") body = viewTopics();
    else if (view === "topic") body = viewTopic();
    else if (view === "lesson") body = viewLesson();
    else if (view === "practise") body = viewPractise();
    else if (view === "mockIntro") body = viewMockIntro();
    else if (view === "mock") body = viewMock();
    else if (view === "mockResult") body = viewMockResult();
    else body = viewHome();

    app.innerHTML = "";
    document.body.insertBefore(header(), document.getElementById("live") ? document.getElementById("live").nextSibling : document.body.firstChild);
    var oldH = document.querySelector("header.app-header");
    if (oldH && oldH !== document.querySelectorAll("header.app-header")[document.querySelectorAll("header.app-header").length - 1]) {
      /* keep a single header */
    }
    var headers = document.querySelectorAll("header.app-header");
    for (var i = 0; i < headers.length - 1; i++) headers[i].remove();
    var mains = document.querySelectorAll("main#main");
    mains.forEach(function (m) { m.remove(); });
    var foots = document.querySelectorAll("footer.app-footer");
    foots.forEach(function (f) { f.remove(); });

    var main = el("main", { id: "main" });
    (body || []).forEach(function (n) { if (n) main.appendChild(n); });
    var h = document.querySelector("header.app-header");
    if (h && h.nextSibling) document.body.insertBefore(main, h.nextSibling);
    else document.body.appendChild(main);
    document.body.appendChild(footer());
  }

  /* Fix: render should not leak headers. Rebuild body around #app. */
  function renderClean() {
    if (state.view === "mock" && state.mock.started && !state.mock.submitted) startMockTimer();
    else if (state.view !== "mock") stopMockTimer();

    var view = state.view;
    var body;
    if (view === "home") body = viewHome();
    else if (view === "diagnoseStart") body = viewDiagnoseStart();
    else if (view === "diagnose") body = viewDiagnose();
    else if (view === "diagnoseResult") body = viewDiagnoseResult();
    else if (view === "topics") body = viewTopics();
    else if (view === "topic") body = viewTopic();
    else if (view === "lesson") body = viewLesson();
    else if (view === "practise") body = viewPractise();
    else if (view === "mockIntro") body = viewMockIntro();
    else if (view === "mock") body = viewMock();
    else if (view === "mockResult") body = viewMockResult();
    else body = viewHome();

    var root = document.getElementById("shell");
    root.innerHTML = "";
    root.appendChild(header());
    var main = el("main", { id: "main" });
    (body || []).forEach(function (n) { if (n) main.appendChild(n); });
    root.appendChild(main);
    root.appendChild(footer());
  }

  render = renderClean;
  render();
})();

</script>
</body>
</html>
