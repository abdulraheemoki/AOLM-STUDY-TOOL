list.","3":"Acquiring competitors is a long-range capacity option, not a new-product-generation item and not short-range scheduling."},"level":1},{"id":"pd-p201","topic":"pd","bank":"practise","type":"tf","stem":"In Figure 5.2, the area in the Introduction phase is labelled Loss.","options":["True","False"],"answer":0,"explainRight":"The figure labels Loss under the cost curve in Introduction. Profit appears later; a small Loss region also appears at the end of Decline.","explainWrong":{"1":"Introduction is labelled Loss on Figure 5.2."},"level":2},{"id":"pd-p202","topic":"pd","bank":"practise","type":"tf","stem":"Figure 5.2 shows a small Loss region again at the end of the Decline phase.","options":["True","False"],"answer":0,"explainRight":"The figure labels Loss at the start (Introduction) and a small Loss region at the end of Decline. Profit occupies much of the middle, from around late Growth through much of Decline.","explainWrong":{"1":"That is how Figure 5.2 is drawn."},"level":2},{"id":"pd-p203","topic":"pd","bank":"practise","type":"mc","stem":"Toyota is used on the product-strategy-options slide as an example of:","options":["Low cost, like Taco Bell","Rapid response","Experience differentiation at a theme park","A FedEx call-centre forecast"],"answer":1,"explainRight":"The three options are differentiation (Shouldice Hospital), low cost (Taco Bell) and rapid response (Toyota).","explainWrong":{"0":"Low cost is Taco Bell on that slide.","2":"Experience differentiation is the Disney example in the intro lecture.","3":"The FedEx figure is in the forecasting lecture."},"level":2},{"id":"pd-p204","topic":"pd","bank":"practise","type":"mc","stem":"“Technological change” appears in the lecture as:","options":["One of the six items under generating new products","The definition of poka-yoke","A short-range FCFS rule","A type of appraisal cost"],"answer":0,"explainRight":"Technological change is item 4 on the generating-new-products list.","explainWrong":{"1":"Poka-yoke is a foolproof device or technique in the quality lecture.","2":"FCFS is a service demand-management rule in the capacity lecture.","3":"Appraisal costs are a cost of quality (evaluating products, parts and services)."},"level":2},{"id":"pd-p301","topic":"pd","bank":"practise","type":"tf","stem":"The operations function, the lecture says, must be able to introduce new products successfully.","options":["True","False"],"answer":0,"explainRight":"That is the second bullet on the product life cycle slide.","explainWrong":{"1":"The lecture states this explicitly."},"level":3},{"id":"pd-p302","topic":"pd","bank":"practise","type":"mc","stem":"A planning matrix that maps “what customers want” to “how the firm will meet those wants” is the lecture’s description of:","options":["Design capacity","The house of quality","A sales force composite","A seasonal index formula"],"answer":1,"explainRight":"That is the house-of-quality bullet. (The slides do not work a full matrix example.)","explainWrong":{"0":"Design capacity is the maximum theoretical output of a system.","2":"A sales force composite aggregates salespeople’s forecasts.","3":"No seasonal-index formula is given in the uploaded slides."},"level":3},{"id":"pd-p303","topic":"pd","bank":"practise","type":"mc","stem":"Which pairing of product-strategy option and lecture example is correct?","options":["Differentiation — Taco Bell; low cost — Toyota","Low cost — Taco Bell; rapid response — Toyota; differentiation — Shouldice Hospital","Rapid response — Shouldice Hospital; differentiation — Taco Bell","All three examples are used only for mass customisation"],"answer":1,"explainRight":"The slide pairs differentiation with Shouldice Hospital, low cost with Taco Bell, and rapid response with Toyota.","explainWrong":{"0":"Those pairings are swapped relative to the slide.","2":"Shouldice is differentiation, not rapid response; Taco Bell is low cost, not differentiation.","3":"Mass customisation is a process strategy (Dell), not the heading for these three product-strategy examples."},"level":3},{"id":"pd-p304","topic":"pd","bank":"practise","type":"tf","stem":"The uploaded lectures state what percentage of sales from new products is indicative of industry leaders.","options":["True","False"],"answer":1,"explainRight":"That percentage is not in the uploaded lectures. A StudyNet quiz asked it, but this tool does not treat any particular percentage as a fact from the slides.","explainWrong":{"0":"The figure is not in the uploaded slides, so the statement is false."},"level":3,"flag":"Check with your lecturer if this percentage is taught from the textbook or another handout — it is not in the uploaded lecture slides."},{"id":"pd-p401","topic":"pd","bank":"practise","type":"tf","stem":"Figure 5.2 names four life-cycle phases — Introduction, Growth, Maturity and Decline — and shows loss, profit, sales and cost curves, but the uploaded lecture text does not state what operations should “focus on” in decline or maturity.","options":["True","False"],"answer":0,"explainRight":"That is an accurate description of what Figure 5.2 and the surrounding bullets do and do not say.","explainWrong":{"1":"The figure names the phases and shows those curves; the operational “focus” statements are not in the uploaded lecture text."},"level":4,"flag":"StudyNet questions about the focus in decline (“high-volume, innovative production”) and capacity concerns in maturity are not settled by the uploaded slides. Check those with your lecturer."},{"id":"pd-p402","topic":"pd","bank":"practise","type":"mc","stem":"Political and legal change is listed in the lecture as:","options":["A cost of quality","An item on the generating-new-products list","A long-range reason to avoid all globalisation","A type of random time-series component"],"answer":1,"explainRight":"It is item 5 under generating new products.","explainWrong":{"0":"The costs of quality are prevention, appraisal, internal failure and external failure.","2":"Globalisation reasons are a different list in the intro lecture; political and legal change is a new-product driver here.","3":"Random is an erratic, non-repeating time-series residual."},"level":4},{"id":"pd-p403","topic":"pd","bank":"practise","type":"mc","stem":"QFD is used to:","options":["Schedule jobs, personnel and machinery in the short range only","Determine what will satisfy the customer and translate those desires into the target design","Compute utilisation as actual output divided by effective capacity","Replace the mission statement"],"answer":1,"explainRight":"Those are the two QFD bullets.","explainWrong":{"0":"Scheduling jobs, personnel and machinery is short-range use of capacity in Figure S7.1.","2":"That formula is efficiency if the denominator is effective capacity; utilisation uses design capacity. Neither is QFD.","3":"QFD is a product-design tool, not a replacement for the mission."},"level":4},{"id":"pd-p404","topic":"pd","bank":"practise","type":"tf","stem":"In Figure 5.2, “Profit” appears as a labelled region from around late Growth through much of Decline.","options":["True","False"],"answer":0,"explainRight":"The figure labels Profit in that middle-to-later region, with Loss in Introduction and a small Loss again at the end of Decline.","explainWrong":{"1":"That is how the figure is labelled."},"level":4},{"id":"pd-m1","topic":"pd","bank":"mock","type":"mc","stem":"Which is a correct product-strategy pairing from the lecture?","options":["Taco Bell — differentiation","Shouldice Hospital — low cost","Toyota — rapid response","Shouldice Hospital — mass customisation"],"answer":2,"explainRight":"Rapid response is illustrated with Toyota. Shouldice Hospital is differentiation; Taco Bell is low cost.","explainWrong":{"0":"Taco Bell is the low-cost example.","1":"Shouldice Hospital is differentiation.","3":"Mass customisation is a process strategy, illustrated with Dell."}},{"id":"pd-m2","topic":"pd","bank":"mock","type":"tf","stem":"The house of quality is a planning matrix relating customer wants to how the firm will meet those wants.","options":["True","False"],"answer":0,"explainRight":"That is the lecture’s house-of-quality bullet.","explainWrong":{"1":"That is the definition on the slide."}},{"id":"pd-m3","topic":"pd","bank":"mock","type":"mc","stem":"Which of the following does Figure 5.2 actually show?","options":["A table of the percentage of sales that industry leaders get from new products","The four phases Introduction, Growth, Maturity and Decline, with Loss and Profit regions","A worked house-of-quality matrix for a hospital","The operational “focus” for every phase, written as a checklist"],"answer":1,"explainRight":"Figure 5.2 is the product life cycle with those four phases and Loss/Profit (and sales and cost) curves. It does not give the industry-leaders percentage, a house-of-quality matrix, or a written operational-focus checklist.","explainWrong":{"0":"That percentage is not in the uploaded lectures.","2":"No worked house-of-quality matrix is in the uploaded slides.","3":"The operational-focus wording is not in the uploaded lecture text. Check with your lecturer if a quiz asks for it."}},{"id":"ps-d1","topic":"ps","bank":"diagnose","type":"tf","stem":"The lecture names four basic process strategies: process focus, repetitive focus, product focus and mass customization.","options":["True","False"],"answer":0,"explainRight":"Those are the four strategies listed on the process-strategies slide, which also notes that within these basic strategies there are many ways they may be implemented.","explainWrong":{"1":"The lecture’s four basic strategies are process focus, repetitive focus, product focus and mass customization."}},{"id":"ps-d2","topic":"ps","bank":"diagnose","type":"mc","stem":"Arnold Palmer Hospital is the lecture’s example of which process strategy?","options":["Product focus","Repetitive focus","Process focus","Mass customization"],"answer":2,"explainRight":"Figure 7.1 / 7.2(a) uses Arnold Palmer Hospital for process focus: high variety, low volume (projects, job shops such as machine shops, print shops, hospitals and restaurants).","explainWrong":{"0":"Product focus is illustrated with Frito-Lay (and steel, glass, beer, commercial baked goods).","1":"Repetitive focus is illustrated with Harley-Davidson (and autos, motorcycles, home appliances).","3":"Mass customization is illustrated with Dell Computer."}},{"id":"ps-d3","topic":"ps","bank":"diagnose","type":"mc","stem":"Product focus, as placed on the lecture diagram, is characterised by:","options":["High variety and low volume","High volume and low variety of products","High variety and high volume","Low volume with both fixed and variable costs high"],"answer":1,"explainRight":"Product focus is high volume but low variety of products (changes in attributes), with examples such as commercial baked goods, steel, glass and beer, and Frito-Lay.","explainWrong":{"0":"High variety and low volume is process focus.","2":"High variety and high volume is mass customization.","3":"That “Poor Strategy” cell has both fixed and variable costs high."}},{"id":"ps-d4","topic":"ps","bank":"diagnose","type":"tf","stem":"The lecture labels a “Poor Strategy” cell in which both fixed and variable costs are high.","options":["True","False"],"answer":0,"explainRight":"The volume–variety diagram marks a “Poor Strategy” region (low volume, changes in attributes) and states: “Both fixed and variable costs are high.”","explainWrong":{"1":"That is the wording on the poor-strategy cell."}},{"id":"ps-p101","topic":"ps","bank":"practise","type":"mc","stem":"In a process-focus facility, the lecture says facilities are organised around:","options":["The product, with long continuous production runs","Specific activities or processes","A single module used for only one output","Mass-customisation software only"],"answer":1,"explainRight":"Process focus: “Facilities are organized around specific activities or processes.” They use general-purpose equipment and skilled personnel, and have a high degree of product flexibility.","explainWrong":{"0":"Organising facilities by product, with long continuous runs, describes product focus.","2":"Repetitive focus uses modules that may be combined for many output options, not a single module for only one output.","3":"Mass customisation is a different strategy (Dell), not the organising idea of process focus."},"level":1},{"id":"ps-p102","topic":"ps","bank":"practise","type":"mc","stem":"Harley-Davidson is the lecture’s worked example of:","options":["Process focus","Repetitive focus","Product focus","The poor-strategy cell"],"answer":1,"explainRight":"Figure 7.2(b) is “(modular) Harley Davidson”: raw material and module inputs (multiple engines and wheel modules) through few modules, combined for many motorcycle outputs.","explainWrong":{"0":"Arnold Palmer Hospital is the process-focus example.","2":"Frito-Lay is the product-focus example.","3":"The poor-strategy cell is not illustrated with Harley-Davidson."},"level":1},{"id":"ps-p103","topic":"ps","bank":"practise","type":"mc","stem":"Frito-Lay, in the process-strategy lecture, illustrates:","options":["Product focus (high-volume, low-variety, continuous process)","Process focus at a hospital","Mass customisation of custom PCs","A jury of executive opinion"],"answer":0,"explainRight":"Figure 7.2(c): “(high-volume, low-variety, continuous process) Frito-Lay”, with few inputs (corn, potatoes, water, seasoning) and output variations in size, shape and packaging.","explainWrong":{"1":"The hospital example is Arnold Palmer Hospital, for process focus.","2":"Custom PCs at Dell are the mass-customisation example.","3":"A jury of executive opinion is a forecasting method."},"level":1},{"id":"ps-p104","topic":"ps","bank":"practise","type":"mc","stem":"Dell Computer is the lecture’s example of:","options":["Process focus","Repetitive focus","Product focus","Mass customization"],"answer":3,"explainRight":"Figure 7.2(d): “(high-volume, high-variety) Dell Computer”, with many part and component inputs through many modules to many output versions (custom PCs and notebooks).","explainWrong":{"0":"Process focus is Arnold Palmer Hospital.","1":"Repetitive focus is Harley-Davidson.","2":"Product focus is Frito-Lay."},"level":1},{"id":"ps-p201","topic":"ps","bank":"practise","type":"tf","stem":"Process focus typically has high costs and low equipment utilization, and product flows may vary considerably, making planning and scheduling a challenge.","options":["True","False"],"answer":0,"explainRight":"Those are process-focus bullets on the lecture slides.","explainWrong":{"1":"The lecture states these as typical features of process focus."},"level":2},{"id":"ps-p202","topic":"ps","bank":"practise","type":"tf","stem":"Product focus typically has high fixed cost but low variable cost, and generally uses less skilled labour.","options":["True","False"],"answer":0,"explainRight":"Those are product-focus bullets, along with long, continuous production runs that enable efficient processes.","explainWrong":{"1":"The lecture states high fixed cost but low variable cost, and generally less skilled labour."},"level":2},{"id":"ps-p203","topic":"ps","bank":"practise","type":"tf","stem":"Mass customization, in the lecture, combines the flexibility of a process focus with the efficiency of a product focus.","options":["True","False"],"answer":0,"explainRight":"That sentence is on the mass-customization slide, which also defines it as the rapid, low-cost production of goods and services to satisfy increasingly unique customer desires.","explainWrong":{"1":"That is the lecture’s description of mass customization."},"level":2},{"id":"ps-p204","topic":"ps","bank":"practise","type":"mc","stem":"A repetitive-focus facility, according to the lecture, is characterised by:","options":["Modules with parts and assemblies made previously, which may be combined for many output options","Many departments and many routings, as at a children’s hospital","Few inputs and only a continuous process with no modules","Always being a “Poor Strategy” because both cost types are high"],"answer":0,"explainRight":"Repetitive focus: facilities often organised as assembly lines; characterised by modules with parts and assemblies made previously; modules may be combined for many output options; less flexibility than process-focused facilities but more efficient.","explainWrong":{"1":"Many departments and many routings is the Arnold Palmer Hospital process-focus description.","2":"Few inputs and a continuous process describes product focus (Frito-Lay).","3":"Repetitive focus is one of the four basic strategies, not the poor-strategy cell."},"level":2},{"id":"ps-p301","topic":"ps","bank":"practise","type":"mc","stem":"A clinic that treats many different patients through many departments and many routings, with uniquely treated outputs, is closest to which lecture example and strategy?","options":["Frito-Lay, product focus","Arnold Palmer Hospital, process focus","Dell, product focus","Harley-Davidson, process focus"],"answer":1,"explainRight":"Figure 7.2(a) describes Arnold Palmer Hospital as a low-volume, high-variety, intermittent process: many inputs (surgeries, sick patients, baby deliveries, emergencies) through many departments and many routings to many different outputs (uniquely treated patients). That is process focus.","explainWrong":{"0":"Frito-Lay is product focus: few inputs and high-volume, low-variety continuous processing.","2":"Dell is mass customization, not product focus.","3":"Harley-Davidson is repetitive focus, not process focus."},"level":3},{"id":"ps-p302","topic":"ps","bank":"practise","type":"mc","stem":"A motorcycle plant builds bikes from engines and wheel modules made earlier, combining a few modules into many different models. Which process strategy is that, as used in the lecture?","options":["Process focus","Mass customization","Repetitive focus","Product focus"],"answer":2,"explainRight":"That is the Harley-Davidson repetitive-focus pattern: modular inputs, few modules, many output combinations. Autos, motorcycles and home appliances are listed in the same mid-volume “changes in modules” group.","explainWrong":{"0":"Process focus is high variety, low volume, organised around activities or processes (hospitals, job shops).","1":"Mass customization is high volume and high variety (Dell), combining process-focus flexibility with product-focus efficiency.","3":"Product focus is high volume, low variety, organised by product (Frito-Lay, steel, glass, beer)."},"level":3},{"id":"ps-p303","topic":"ps","bank":"practise","type":"mc","stem":"Which of the following is grouped with autos and home appliances as a repetitive-focus example in the lecture?","options":["Steel","Commercial baked goods","Motorcycles","Custom cakes in a job-shop bakery"],"answer":2,"explainRight":"The repetitive cell lists “autos, motorcycles, home appliances” and uses Harley-Davidson as the named example. Steel and commercial baked goods sit in the product-focus cell; a custom cake in a job shop fits process focus (job shops, restaurants).","explainWrong":{"0":"Steel is listed under product focus, with glass, beer and commercial baked goods.","1":"Commercial baked goods are a product-focus example.","3":"Custom, job-shop work is process focus (projects, job shops, restaurants)."},"level":3},{"id":"ps-p304","topic":"ps","bank":"practise","type":"mc","stem":"Which phrase does the lecture use of product focus (and not of process focus)?","options":["High degree of product flexibility, with general-purpose equipment","Typically high fixed cost but low variable cost","High variety, low volume, intermittent processes","Both fixed and variable costs are high"],"answer":1,"explainRight":"Product focus: typically high fixed cost but low variable cost; high volume but low variety; facilities organised by product. High flexibility and general-purpose equipment are process-focus points. “Both fixed and variable costs are high” is the poor-strategy cell.","explainWrong":{"0":"Those are process-focus bullets.","2":"That wording is used for process focus (Figure 7.2(a)).","3":"That is the poor-strategy cell, not product focus."},"level":3},{"id":"ps-p401","topic":"ps","bank":"practise","type":"mc","stem":"The “Poor Strategy” region on the lecture diagram is described as:","options":["High volume and high variety, which is always the goal","Low volume with changes in attributes, where both fixed and variable costs are high","The same as mass customization at Dell","Any repetitive assembly line"],"answer":1,"explainRight":"The diagram marks a poor-strategy cell at low volume, changes in attributes, and states that both fixed and variable costs are high.","explainWrong":{"0":"High volume and high variety is mass customization, which the lecture calls difficult to achieve but with huge rewards — not the poor-strategy cell.","2":"Dell is the mass-customization example, not the poor-strategy cell.","3":"A repetitive assembly line is one of the four basic strategies."},"level":4},{"id":"ps-p402","topic":"ps","bank":"practise","type":"mc","stem":"Which set is listed in the lecture as product-focus examples (high volume, changes in attributes)?","options":["Hospitals, restaurants, and print job shops","Autos, motorcycles, and home appliances","Commercial baked goods, steel, glass and beer","Custom PCs and uniquely treated hospital patients"],"answer":2,"explainRight":"Product focus lists commercial baked goods, steel, glass and beer, with Frito-Lay as the worked figure. Hospitals and restaurants are process focus; autos and motorcycles are repetitive; custom PCs are mass customization.","explainWrong":{"0":"Those are process-focus settings (projects, job shops).","1":"Those are repetitive-focus examples.","3":"Custom PCs are Dell (mass customization); uniquely treated patients are Arnold Palmer Hospital (process focus)."},"level":4},{"id":"ps-p403","topic":"ps","bank":"practise","type":"tf","stem":"Process focus is described as low-volume, high-variety, intermittent processes, using general-purpose equipment and skilled personnel.","options":["True","False"],"answer":0,"explainRight":"Figure 7.2(a) calls process focus “(low-volume, high-variety, intermittent processes)”, and the bullets include general-purpose equipment and skilled personnel.","explainWrong":{"1":"That is the lecture description of process focus."},"level":4},{"id":"ps-p404","topic":"ps","bank":"practise","type":"mc","stem":"Mass customization is placed on the lecture diagram as:","options":["High variety and low volume, like a job shop","High variety and high volume — “difficult to achieve, but huge rewards”","High volume and low variety, like a continuous baked-goods line","A poor strategy because both cost types are high"],"answer":1,"explainRight":"Mass customization is the high-variety, high-volume cell, marked “difficult to achieve, but huge rewards”, and illustrated with Dell Computer.","explainWrong":{"0":"High variety and low volume is process focus.","2":"High volume and low variety is product focus.","3":"The poor-strategy cell is a different region of the same diagram."},"level":4},{"id":"ps-m1","topic":"ps","bank":"mock","type":"mc","stem":"Which pairing of process strategy and lecture example is correct?","options":["Process focus — Frito-Lay","Repetitive focus — Dell Computer","Product focus — Frito-Lay","Mass customization — Arnold Palmer Hospital"],"answer":2,"explainRight":"Product focus is illustrated with Frito-Lay. Process focus is Arnold Palmer Hospital; repetitive is Harley-Davidson; mass customization is Dell.","explainWrong":{"0":"Frito-Lay is product focus, not process focus.","1":"Dell is mass customization, not repetitive focus.","3":"Arnold Palmer Hospital is process focus, not mass customization."}},{"id":"ps-m2","topic":"ps","bank":"mock","type":"tf","stem":"A process-focus facility typically has high costs and low equipment utilization.","options":["True","False"],"answer":0,"explainRight":"That is a process-focus bullet, together with high product flexibility and variable product flows that make planning and scheduling a challenge.","explainWrong":{"1":"The lecture states this of process focus."}},{"id":"ps-m3","topic":"ps","bank":"mock","type":"mc","stem":"Mass customization is defined in the lecture as:","options":["Organising facilities only around a single continuous product with no variety","The rapid, low-cost production of goods and services to satisfy increasingly unique customer desires","A forecast method used when little data exist","The same as the “Poor Strategy” cell"],"answer":1,"explainRight":"That is the mass-customization definition. It combines process-focus flexibility with product-focus efficiency.","explainWrong":{"0":"That is closer to product focus (high volume, low variety, continuous runs), not mass customization.","2":"Qualitative forecasting methods are used when the situation is vague and little data exist.","3":"The poor-strategy cell is a different region, where both fixed and variable costs are high."}},{"id":"cap-d1","topic":"cap","bank":"diagnose","type":"tf","stem":"Design capacity is the maximum theoretical output of a system, and it is normally expressed as a rate.","options":["True","False"],"answer":0,"explainRight":"That is the lecture definition. Examples given for expressing it as a rate include beds (a hospital), active members (a church), or billable hours (a CPA firm).","explainWrong":{"1":"That is the lecture definition of design capacity."}},{"id":"cap-d2","topic":"cap","bank":"diagnose","type":"mc","stem":"Utilization, as written on the formula slide, is:","options":["Actual output divided by effective capacity","Actual output divided by design capacity","Design capacity divided by actual output","Effective capacity divided by design capacity"],"answer":1,"explainRight":"The slide says: Utilization is the percent of design capacity actually achieved. Utilization = Actual output / Design capacity.","explainWrong":{"0":"Actual output / effective capacity is efficiency, not utilization.","2":"The denominator is design capacity, and the numerator is actual output, not the other way around.","3":"That is not either formula on the slide."}},{"id":"cap-d3","topic":"cap","bank":"diagnose","type":"mc","stem":"Efficiency, as written on the formula slide, is:","options":["Actual output divided by design capacity","Actual output divided by effective capacity","Effective capacity divided by actual output","Always equal to utilization"],"answer":1,"explainRight":"The slide says: Efficiency is the percent of effective capacity actually achieved. Efficiency = Actual output / Effective capacity.","explainWrong":{"0":"Actual output / design capacity is utilization.","2":"The numerator is actual output and the denominator is effective capacity.","3":"The two measures use different denominators, so they are not generally equal. In the bakery example, utilization is 73.4% and efficiency is 84.6%."}},{"id":"cap-d4","topic":"cap","bank":"diagnose","type":"tf","stem":"Effective capacity is often lower than design capacity.","options":["True","False"],"answer":0,"explainRight":"The lecture defines effective capacity as the capacity a firm expects to achieve given current operating constraints, and states that it is often lower than design capacity.","explainWrong":{"1":"The lecture says effective capacity is often lower than design capacity."}},{"id":"cap-p101","topic":"cap","bank":"practise","type":"mc","stem":"Capacity is defined in the lecture as:","options":["Only the number of people on the payroll","The throughput, or the number of units a facility can hold, receive, store, or produce in a period of time","The same thing as a product life cycle","A qualitative forecast"],"answer":1,"explainRight":"That is the opening definition. The lecture also says capacity determines if demand will be satisfied and determines fixed costs, and that there are three time horizons.","explainWrong":{"0":"Workforce size can affect capacity, but that is not the definition on the slide.","2":"The product life cycle is a product-design topic, not the definition of capacity.","3":"A qualitative forecast is a forecasting method family."},"level":1},{"id":"cap-p102","topic":"cap","bank":"practise","type":"mc","stem":"Which of the following is a lecture example of design capacity expressed as a rate?","options":["Beds in a hospital","A poka-yoke lid","A Delphi panel","A house-of-quality roof"],"answer":0,"explainRight":"The slide lists beds (a hospital), active members (a church), or billable hours (a CPA firm) as ways design capacity is normally expressed as a rate.","explainWrong":{"1":"Poka-yoke is a quality-lecture idea (foolproof devices).","2":"Delphi is a qualitative forecasting method.","3":"The house of quality is a product-design planning matrix."},"level":1},{"id":"cap-p103","topic":"cap","bank":"practise","type":"tf","stem":"Effective capacity is the capacity a firm expects to achieve given current operating constraints.","options":["True","False"],"answer":0,"explainRight":"That is the lecture definition, which also says it is often lower than design capacity.","explainWrong":{"1":"That is the lecture definition of effective capacity."},"level":1},{"id":"cap-p104","topic":"cap","bank":"practise","type":"tf","stem":"Utilization is the percent of design capacity actually achieved.","options":["True","False"],"answer":0,"explainRight":"That sentence appears immediately above the utilization formula on the formula slide.","explainWrong":{"1":"The lecture states this explicitly."},"level":1},{"id":"cap-p201","topic":"cap","bank":"practise","type":"num","stem":"Frito-Lay machines are designed to produce 1,000 bags of chips per hour, and the plant operates 16 hours per day. Using the lecture’s working, what is design capacity in bags per day?","answer":16000,"unit":"bags/day","tol":0.5,"working":["Design capacity is the maximum theoretical output under ideal conditions for the time the system is available.","Design capacity = 1,000 bags per hour × 16 hours per day.","1,000 × 16 = 16,000 bags per day."],"explainRight":"The lecture’s Frito-Lay working is 1,000 bags/hr × 16 hrs = 16,000 bags/day.","level":2,"hint":"Enter the number of bags per day, as in the lecture (16000)."},{"id":"cap-p202","topic":"cap","bank":"practise","type":"num","stem":"Frito-Lay’s design capacity is 16,000 bags per day. The plant loses 3 hours of output per day to planned unavailability (preventive maintenance, breaks and changeovers) at 1,000 bags per hour. What is effective capacity in bags per day?","answer":13000,"unit":"bags/day","tol":0.5,"working":["Effective capacity = design capacity minus lost output because of planned resource unavailability.","Lost planned output = 1,000 bags per hour × 3 hours per day = 3,000 bags per day.","Effective capacity = 16,000 − 3,000 = 13,000 bags per day."],"explainRight":"The lecture’s working: 16,000 bags/day − (1,000 bags/hr)(3 hr/day) = 13,000 bags/day.","level":2,"hint":"Enter bags per day (13000)."},{"id":"cap-p203","topic":"cap","bank":"practise","type":"num","stem":"Frito-Lay’s effective capacity is 13,000 bags per day. On average the machines are not running 1 hour per day because of late parts and breakdowns, at 1,000 bags per hour. What is actual output in bags per day?","answer":12000,"unit":"bags/day","tol":0.5,"working":["Actual output = effective capacity minus lost output during unplanned resource idleness (for example absenteeism, breakdowns, unavailable parts, quality problems).","Unplanned loss = 1,000 bags per hour × 1 hour per day = 1,000 bags per day.","Actual output = 13,000 − 1,000 = 12,000 bags per day."],"explainRight":"The lecture’s working: 13,000 bags/day − 1,000 bags/day = 12,000 bags/day.","level":2,"hint":"Enter bags per day (12000)."},{"id":"cap-p204","topic":"cap","bank":"practise","type":"mc","stem":"In Table S7.1, planned resource unavailability (for example preventive maintenance, setups and scheduled breaks) is subtracted when moving from:","options":["Effective capacity to actual output","Design capacity to effective capacity","Actual output to design capacity","Efficiency to utilization, as a forecast step"],"answer":1,"explainRight":"Effective capacity is design capacity minus lost output because of planned resource unavailability. Actual output is then effective capacity minus lost output during unplanned resource idleness (absenteeism, breakdowns, unavailable parts, quality problems).","explainWrong":{"0":"The step from effective capacity to actual output subtracts unplanned idleness, not planned unavailability.","2":"The lecture does not subtract in that direction.","3":"Utilization and efficiency are ratios; this question is about how the three capacity figures are derived."},"level":2},{"id":"cap-p301","topic":"cap","bank":"practise","type":"num","stem":"A bakery’s design rate is 1,200 rolls per hour. It operates 7 days a week, with three 8-hour shifts each day. Using the lecture’s bakery working, what is design capacity in rolls for the week?","answer":201600,"unit":"rolls","tol":0.5,"working":["Hours available in the week = 7 days × 3 shifts × 8 hours = 168 hours.","Design capacity = 168 hours × 1,200 rolls per hour.","The lecture writes this as (7 × 3 × 8) × 1,200 = 201,600 rolls."],"explainRight":"The lecture’s bakery design capacity is (7 × 3 × 8) × 1,200 = 201,600 rolls.","level":3,"hint":"Enter the weekly design capacity in rolls (201600)."},{"id":"cap-p302","topic":"cap","bank":"practise","type":"num","stem":"In the lecture’s bakery example, actual production last week was 148,000 rolls and design capacity was 201,600 rolls. What is utilization, as a percentage (the lecture reports one decimal place)?","answer":73.4,"unit":"%","tol":0.5,"working":["Utilization = Actual output / Design capacity.","148,000 ÷ 201,600 = 0.73313…","As a percentage, the lecture reports 73.4%."],"explainRight":"The lecture’s bakery utilization is 148,000 / 201,600 = 73.4%. Answers within 0.5 percentage points are accepted.","level":3,"hint":"Enter the percentage, for example 73.4. A decimal such as 0.734 is also accepted."},{"id":"cap-p303","topic":"cap","bank":"practise","type":"num","stem":"In the lecture’s bakery example, actual production last week was 148,000 rolls and effective capacity was 175,000 rolls. What is efficiency, as a percentage (the lecture reports one decimal place)?","answer":84.6,"unit":"%","tol":0.5,"working":["Efficiency = Actual output / Effective capacity.","148,000 ÷ 175,000 = 0.84571…","As a percentage, the lecture reports 84.6%."],"explainRight":"The lecture’s bakery efficiency is 148,000 / 175,000 = 84.6%. Answers within 0.5 percentage points are accepted.","level":3,"hint":"Enter the percentage, for example 84.6."},{"id":"cap-p304","topic":"cap","bank":"practise","type":"mc","stem":"If demand exceeds capacity, the lecture’s managing-demand slide says you should:","options":["Only close facilities immediately, with no other option listed","Curtail demand by raising prices and scheduling longer lead times, with the long-term solution being to increase capacity","Always stimulate the market and change the product first","Produce nothing until the forecast is naive"],"answer":1,"explainRight":"If demand exceeds capacity: curtail demand by raising prices, scheduling longer lead times; the long-term solution is to increase capacity. (If capacity exceeds demand, the same slide says stimulate the market and make product changes. Seasonal demands: produce products with complementary demand patterns.)","explainWrong":{"0":"Closing facilities is one of the later “tactics for matching capacity to demand”, not the opening advice when demand exceeds capacity.","2":"Stimulating the market and product changes are listed for when capacity exceeds demand.","3":"The naive forecast is a forecasting method, not a demand-management rule here."},"level":3},{"id":"cap-p401","topic":"cap","bank":"practise","type":"num","stem":"Practice problem (same formulas as the lecture, new numbers). A campus café’s design capacity is 400 drinks per day and actual output is 300 drinks per day. What is utilization, as a percentage?","answer":75,"unit":"%","tol":0.5,"working":["Utilization = Actual output / Design capacity.","300 ÷ 400 = 0.75.","As a percentage, utilization = 75%."],"explainRight":"Utilization = 300 / 400 = 75%. This is a practice problem using the lecture formula with new everyday numbers. Answers within 0.5 percentage points are accepted.","level":4,"hint":"Enter 75 (or 75.0). A proportion such as 0.75 is also accepted."},{"id":"cap-p402","topic":"cap","bank":"practise","type":"num","stem":"Practice problem (same formulas as the lecture, new numbers). The same café’s effective capacity is 350 drinks per day and actual output is 300 drinks per day. What is efficiency, as a percentage, to one decimal place?","answer":85.7,"unit":"%","tol":0.5,"working":["Efficiency = Actual output / Effective capacity.","300 ÷ 350 = 0.85714…","As a percentage, that is 85.7% when rounded to one decimal place, as the bakery example is reported."],"explainRight":"Efficiency = 300 / 350 = 85.7% (to one decimal place). Answers within 0.5 percentage points are accepted, so 85.7 or 86 will both be marked right.","level":4,"hint":"Enter 85.7 (a proportion such as 0.857 is also accepted)."},{"id":"cap-p403","topic":"cap","bank":"practise","type":"num","stem":"Practice problem (same formulas as the lecture, new numbers). A student print room can print 50 pages per hour and is open 5 days, with two 8-hour shifts each day. Actual output last week was 3,200 pages. What is utilization, as a percentage?","answer":80,"unit":"%","tol":0.5,"working":["Design capacity for the week = (5 days × 2 shifts × 8 hours) × 50 pages per hour.","5 × 2 × 8 = 80 hours; 80 × 50 = 4,000 pages.","Utilization = Actual output / Design capacity = 3,200 / 4,000 = 0.80 = 80%."],"explainRight":"Design capacity is 4,000 pages; utilization = 3,200 / 4,000 = 80%. Practice numbers, lecture formula. Answers within 0.5 percentage points are accepted.","level":4,"hint":"Enter 80. First compute weekly design capacity, then divide actual by design."},{"id":"cap-p404","topic":"cap","bank":"practise","type":"mc","stem":"According to Figure S7.1, short-range planning (scheduling) uses capacity by:","options":["Designing new production processes and acquiring competitors","Scheduling jobs, scheduling personnel, and allocating machinery","Only building inventory, because short-range capacity is easy to expand","Selling facilities as the first listed option"],"answer":1,"explainRight":"In the short-range “use capacity” column the figure lists: schedule jobs; schedule personnel; allocate machinery. A footnote says it is difficult to adjust (modify) capacity in the short range, as limited options exist. Designing new processes, adding long-lead equipment, acquiring or selling facilities, and acquiring competitors are long-range ways to modify capacity.","explainWrong":{"0":"Those are long-range ways to modify capacity.","2":"Building or using inventory is an intermediate-range way to use capacity. The figure also marks short-range capacity as difficult to adjust.","3":"Acquiring or selling facilities is a long-range modify-capacity option."},"level":4},{"id":"cap-m1","topic":"cap","bank":"mock","type":"num","stem":"Using the lecture’s Frito-Lay figures — actual output 12,000 bags per day and design capacity 16,000 bags per day — what is utilization, as a percentage?","answer":75,"unit":"%","tol":0.5,"working":["Utilization = Actual output / Design capacity.","12,000 ÷ 16,000 = 0.75.","As a percentage, utilization = 75%."],"explainRight":"Utilization = 12,000 / 16,000 = 75%. Answers within 0.5 percentage points are accepted.","hint":"Enter 75."},{"id":"cap-m2","topic":"cap","bank":"mock","type":"num","stem":"Practice problem (lecture formulas, new numbers). A small bakery’s actual output is 900 loaves, and its effective capacity is 1,200 loaves. What is efficiency, as a percentage?","answer":75,"unit":"%","tol":0.5,"working":["Efficiency = Actual output / Effective capacity.","900 ÷ 1,200 = 0.75.","As a percentage, efficiency = 75%."],"explainRight":"Efficiency = 900 / 1,200 = 75%. Answers within 0.5 percentage points are accepted.","hint":"Enter 75."},{"id":"cap-m3","topic":"cap","bank":"mock","type":"mc","stem":"In the service sector, the lecture says scheduling customers is demand management, and scheduling the workforce is capacity management. Which of the following is listed as a demand-management method?","options":["Only buying long-lead-time equipment, which is a short-range modify-capacity option","Appointments (doctors’ and lawyers’ offices), reservations (rental cars, hotels and some restaurants), and the FCFS rule (retail shops, a post office, or a fast-food restaurant)","Full-time, temporary and part-time staff, which the slide lists as demand management","Naive forecasting of the business cycle only"],"answer":1,"explainRight":"Demand management: appointment (doctors’ and lawyers’ offices); reservations (rental car agencies, hotels and some restaurants); FCFS rule (retail shops, a post office, or a fast-food restaurant). Capacity management — “when managing demand is not feasible” — is full-time, temporary and part-time staff.","explainWrong":{"0":"Adding or selling long-lead-time equipment is a long-range modify-capacity option in Figure S7.1, not a service demand-management method.","2":"Full-time, temporary and part-time staff are listed under capacity management, not demand management.","3":"The naive approach is a forecasting method, and economic forecasts address the business cycle."}},{"id":"scm-d1","topic":"scm","bank":"diagnose","type":"tf","stem":"The objective of supply chain management, as stated in the lecture, is to structure the supply chain to maximize its competitive advantage and benefits to the ultimate consumer.","options":["True","False"],"answer":0,"explainRight":"That sentence is the SCM objective on the lecture slide.","explainWrong":{"1":"That is the lecture’s stated objective of supply chain management."}},{"id":"scm-d2","topic":"scm","bank":"diagnose","type":"mc","stem":"In Table 11.1 (supply chain costs as a percentage of sales), which industry is listed with the highest percentage?","options":["Restaurants, at 35","Automobiles, at 67","Petroleum, at 79","Beverages, at 52"],"answer":2,"explainRight":"Table 11.1 lists petroleum at 79, the highest figure in the table. Automobiles are 67, beverages 52, and restaurants 35 (the lowest figure shown).","explainWrong":{"0":"Restaurants are listed at 35, the lowest percentage in the table, not the highest.","1":"Automobiles are listed at 67, which is high but not the highest.","3":"Beverages are listed at 52."}},{"id":"scm-d3","topic":"scm","bank":"diagnose","type":"tf","stem":"A many-suppliers strategy is commonly used for commodity products, and purchasing is typically based on price.","options":["True","False"],"answer":0,"explainRight":"Those are the opening bullets on the many-suppliers slide. The same slide says suppliers compete with one another.","explainWrong":{"1":"The lecture states this of the many-suppliers strategy."}},{"id":"scm-d4","topic":"scm","bank":"diagnose","type":"mc","stem":"Which of the following are the two sourcing strategies that the uploaded lecture actually explains (not only names)?","options":["Vertical integration and keiretsu networks","Many suppliers and few suppliers","Joint ventures and virtual companies","Only outsourcing, with no sourcing-strategy list"],"answer":1,"explainRight":"Six sourcing strategies are listed: many suppliers; few suppliers; vertical integration; joint ventures; keiretsu networks; virtual companies. Only many-suppliers and few-suppliers are then explained. The other four are names only in this deck.","explainWrong":{"0":"Those two are named on the list and are not explained in the uploaded lecture.","2":"Those two are named on the list and are not explained in the uploaded lecture.","3":"Outsourcing is defined on a nearby slide, and a six-item sourcing-strategy list is given."}},{"id":"scm-p101","topic":"scm","bank":"practise","type":"tf","stem":"The lecture describes the supply chain as the coordination of all supply chain activities, starting with raw materials and ending with a satisfied customer.","options":["True","False"],"answer":0,"explainRight":"That is the strategic-importance slide, which also says the chain includes suppliers, manufacturers and/or service providers, distributors, wholesalers, retailers, and final customers.","explainWrong":{"1":"That is the lecture wording."},"level":1},{"id":"scm-p102","topic":"scm","bank":"practise","type":"mc","stem":"In Table 11.1, restaurants are listed at what percentage of sales for supply chain costs?","options":["79","67","35","52"],"answer":2,"explainRight":"Restaurants 35. For comparison: petroleum 79, automobiles 67, beverages 52, food 60, paper 55.","explainWrong":{"0":"79 is petroleum.","1":"67 is automobiles.","3":"52 is beverages."},"level":1},{"id":"scm-p103","topic":"scm","bank":"practise","type":"mc","stem":"Make-or-buy, as defined in the lecture, is:","options":["Transferring traditional internal activities and resources to outside vendors","Choosing between obtaining products and services externally as opposed to producing them internally","A qualitative forecast used for new technology only","The same as a poka-yoke checklist"],"answer":1,"explainRight":"Make-or-buy is “choosing between obtaining products and services externally as opposed to producing them internally”. Outsourcing is the nearby definition: transfer traditional internal activities and resources to outside vendors.","explainWrong":{"0":"That is the lecture definition of outsourcing, not make-or-buy.","2":"Qualitative forecasts are a forecasting topic.","3":"Poka-yoke is a quality-lecture idea."},"level":1},{"id":"scm-p104","topic":"scm","bank":"practise","type":"mc","stem":"Outsourcing, in the lecture, includes which of the following ideas?","options":["Transfer traditional internal activities and resources to outside vendors, with efficiency in specialization and a focus on core competencies","Always using as many commodity suppliers as possible, and never a vendor","A short-range way to acquire a competitor","The house of quality matrix"],"answer":0,"explainRight":"Outsourcing: transfer traditional internal activities and resources to outside vendors; efficiency in specialization; focus on core competencies.","explainWrong":{"1":"Many-suppliers is a separate sourcing strategy, commonly used for commodity products. Outsourcing is not defined as “never a vendor”.","2":"Acquiring competitors is a long-range capacity option in Figure S7.1.","3":"The house of quality is a product-design tool."},"level":1},{"id":"scm-p201","topic":"scm","bank":"practise","type":"mc","stem":"Under a many-suppliers strategy, the lecture says the supplier is responsible for:","options":["Only delivery, with the buyer doing all forecasting and quality work","Technology, expertise, forecasting, cost, quality, and delivery","Nothing, because the buyer owns the supplier","Political-risk insurance only"],"answer":1,"explainRight":"The many-suppliers slide lists those six responsibilities. It also says suppliers compete with one another, and purchasing is typically based on price.","explainWrong":{"0":"The slide gives a longer list than delivery alone: technology, expertise, forecasting, cost, quality and delivery.","2":"The lecture does not say the buyer owns the supplier under this strategy.","3":"Political-risk insurance is a tactic in Table 11.3, not a many-suppliers responsibility list."},"level":2},{"id":"scm-p202","topic":"scm","bank":"practise","type":"mc","stem":"Which of the following is a lecture point about a few-suppliers strategy?","options":["Purchasing is typically based on price, as with commodity products","The buyer forms long-term relationships with fewer suppliers, and the cost of changing suppliers is huge","Suppliers never contribute design expertise","There is no risk to trade secrets"],"answer":1,"explainRight":"Few suppliers: the buyer forms long-term relationships with fewer suppliers; value is created through economies of scale and learning-curve improvements; suppliers are more willing to participate in JIT programmes and contribute design and technological expertise; the cost of changing suppliers is huge; trade secrets and other alliances may be at risk.","explainWrong":{"0":"Purchasing typically based on price, for commodity products, is a many-suppliers point.","2":"The lecture says suppliers are more willing to contribute design and technological expertise.","3":"The lecture warns that trade secrets and other alliances may be at risk."},"level":2},{"id":"scm-p203","topic":"scm","bank":"practise","type":"mc","stem":"In Table 11.2, the primary supplier-selection criteria under a low-cost strategy are listed as:","options":["Capacity, speed and flexibility","Product-development skills, willingness to share information, and jointly developing products","Cost","Only modular design"],"answer":2,"explainRight":"Low-cost: Cost. Response: Capacity; Speed; Flexibility. Differentiation: Product development skills; willing to share information; jointly and rapidly develop products.","explainWrong":{"0":"Those are the response-strategy selection criteria.","1":"Those are the differentiation-strategy selection criteria.","3":"Modular design to aid product differentiation is a product-design characteristic under differentiation, not the primary selection criterion under low cost."},"level":2},{"id":"scm-p204","topic":"scm","bank":"practise","type":"mc","stem":"How does Table 11.2 treat supply-chain inventory under a response strategy?","options":["Minimize inventory to hold down costs","Use buffer stocks to ensure speedy supply","Minimize inventory to avoid product obsolescence","Never hold any inventory, in any strategy"],"answer":1,"explainRight":"Response: use buffer stocks to ensure speedy supply. Low-cost: minimize inventory to hold down costs. Differentiation: minimize inventory to avoid product obsolescence.","explainWrong":{"0":"That is the low-cost inventory approach in the table.","2":"That is the differentiation inventory approach in the table.","3":"The table describes three different inventory approaches, not a single “never hold inventory” rule."},"level":2},{"id":"scm-p301","topic":"scm","bank":"practise","type":"mc","stem":"A firm in the petroleum industry is compared, in Table 11.1, with restaurants. Which comparison matches the table?","options":["Petroleum 35; restaurants 79","Petroleum 79; restaurants 35","Both are listed at 67, like automobiles","The table does not include either industry"],"answer":1,"explainRight":"Petroleum is 79 and restaurants are 35 — the highest and lowest percentages in Table 11.1. Automobiles are 67.","explainWrong":{"0":"Those two figures are swapped.","2":"67 is the automobiles figure, not a shared figure for petroleum and restaurants.","3":"Both industries are in the table."},"level":3},{"id":"scm-p302","topic":"scm","bank":"practise","type":"tf","stem":"Vertical integration, joint ventures, keiretsu networks and virtual companies appear as names on the six-sourcing-strategies list, but the uploaded lecture does not explain them.","options":["True","False"],"answer":0,"explainRight":"The list has six names. Only many-suppliers and few-suppliers have following slides that explain them. This tool does not invent definitions for the other four.","explainWrong":{"1":"That is an accurate account of what the uploaded deck does and does not explain."},"level":3,"flag":"Check with your lecturer if those four strategies are taught from the textbook or another handout — they are not explained in the uploaded slides."},{"id":"scm-p303","topic":"scm","bank":"practise","type":"mc","stem":"Table 11.3’s example for “supplier failure to deliver” is:","options":["Boeing’s international communication system","McDonald’s planning its supply chain six years before opening in Russia, and closely monitoring every plant","Honda and Nissan moving manufacturing out of Japan because of the yen","The Domestic Port Radiation Initiative"],"answer":1,"explainRight":"Supplier failure to deliver: tactics include using multiple suppliers, effective contracts with penalties, subcontractors on retainer, and preplanning. The example is McDonald’s planning its supply chain six years before opening in Russia, with every plant — bakery, meat, chicken, fish and lettuce — closely monitored.","explainWrong":{"0":"Boeing’s communication system is the example for information loss or distortion.","2":"Honda and Nissan is the economic-risk example (exchange rates).","3":"The Domestic Port Radiation Initiative is the example under theft, vandalism and terrorism."},"level":3},{"id":"scm-p304","topic":"scm","bank":"practise","type":"mc","stem":"Hard Rock Café, in Table 11.3, is the example for which risk, and what tactic is named?","options":["Natural catastrophes — always owning every site","Political risk — franchising and licensing rather than owning when political and cultural barriers seem significant","Supplier quality failures — third-party audits only, with no other firm named","Economic risk — hedging, with no firm named"],"answer":1,"explainRight":"Political risk tactics: political risk insurance; cross-country diversification; franchising and licensing. Example: Hard Rock Café reduces political risk by franchising and licensing, rather than owning, when the political and cultural barriers seem significant.","explainWrong":{"0":"The natural-catastrophe example is Toyota seeking at least two suppliers in different regions. Hard Rock is the political-risk example, and the tactic is franchising and licensing rather than owning.","2":"Supplier quality failures is illustrated with Darden Restaurants (including third-party audits), not Hard Rock.","3":"Economic risk is illustrated with Honda and Nissan, and includes hedging and contracts that address price fluctuations."},"level":3},{"id":"scm-p401","topic":"scm","bank":"practise","type":"mc","stem":"After fires, earthquakes and tsunamis, Table 11.3 says Toyota now attempts to:","options":["Use only one global supplier for every component","Have at least two suppliers, each in a different geographical region, for each component","Stop all insurance and alternate sourcing","Move all manufacturing into a single plant in Japan"],"answer":1,"explainRight":"Natural catastrophes: tactics are insurance, alternate sourcing and cross-country diversification. The example is that Toyota, after fires, earthquakes and tsunamis, now attempts to have at least two suppliers, each in a different geographical region, for each component.","explainWrong":{"0":"The lecture example is the opposite: at least two suppliers in different regions.","2":"Insurance and alternate sourcing are listed as tactics, not as things to stop.","3":"The economic-risk example is Honda and Nissan moving manufacturing out of Japan as the yen makes Japanese-made autos more expensive — and that is a different row from natural catastrophes."},"level":4},{"id":"scm-p402","topic":"scm","bank":"practise","type":"mc","stem":"Table 11.3’s economic-risk example is that Honda and Nissan are moving more manufacturing out of Japan because:","options":["Political and cultural barriers make owning cafés difficult","The exchange rate for the yen makes Japanese-made autos more expensive","Radiation monitors are scanning imported containers","A house-of-quality matrix requires it"],"answer":1,"explainRight":"Economic-risk tactics include hedging to combat exchange-rate risk and purchasing contracts that address price fluctuations. The example is Honda and Nissan moving more manufacturing out of Japan as the exchange rate for the yen makes Japanese-made autos more expensive.","explainWrong":{"0":"That is closer to the Hard Rock political-risk example (franchising and licensing).","2":"That is the Domestic Port Radiation Initiative example under theft, vandalism and terrorism.","3":"The house of quality is a product-design tool, not a Table 11.3 tactic."},"level":4},{"id":"scm-p403","topic":"scm","bank":"practise","type":"mc","stem":"Under a low-cost strategy, Table 11.2 describes the distribution network as:","options":["Fast transportation and premium customer service","Inexpensive transportation, and selling through discount distributors/retailers","Gathering market-research data and using a knowledgeable sales staff","Only franchising, as at Hard Rock"],"answer":1,"explainRight":"Low-cost distribution: inexpensive transportation; sell through discount distributors/retailers. Response: fast transportation; provide premium customer service. Differentiation: gather and communicate market research data; knowledgeable sales staff.","explainWrong":{"0":"That is the response-strategy distribution network.","2":"That is the differentiation-strategy distribution network.","3":"Franchising at Hard Rock is a political-risk tactic in Table 11.3, not a Table 11.2 distribution-network row."},"level":4},{"id":"scm-p404","topic":"scm","bank":"practise","type":"mc","stem":"Which of the following is a lecture point about supply-chain risk?","options":["More reliance on supply chains means more risk, and fewer suppliers increase dependence","Risk disappears once a firm outsources","Globalization reduces all logistical complexity, according to the slide","The lecture lists no mitigation headlines at all"],"answer":0,"explainRight":"The risk slides say: more reliance on supply chains means more risk; fewer suppliers increase dependence; risk is compounded by globalization and logistical complexity; there are vendor reliability and quality risks, and political and currency risks. Mitigation headlines include research and assess possible risks, innovative planning, reduce potential disruptions, prepare responses, flexible secure supply chains, and a diversified supplier base.","explainWrong":{"1":"The lecture does not say risk disappears with outsourcing. Outsourcing itself is a risk row in Table 11.3.","2":"The slide says risk is compounded by globalization and logistical complexity, not reduced by them.","3":"Mitigation headlines are listed, as summarised in the correct-answer explanation."},"level":4},{"id":"scm-m1","topic":"scm","bank":"mock","type":"tf","stem":"The supply chain, in the lecture, includes suppliers, manufacturers and/or service providers, distributors, wholesalers, retailers, and final customers.","options":["True","False"],"answer":0,"explainRight":"That list is on the strategic-importance slide.","explainWrong":{"1":"That is the lecture list."}},{"id":"scm-m2","topic":"scm","bank":"mock","type":"mc","stem":"Compared with a many-suppliers approach, a few-suppliers strategy as described in the lecture is more likely to involve:","options":["Purchasing typically based on price for commodity products, with suppliers competing mainly on that basis","Long-term relationships, economies of scale and learning-curve improvements, and a huge cost of changing suppliers","No discussion of JIT or design expertise","A rule that trade secrets cannot be at risk"],"answer":1,"explainRight":"Those are few-suppliers bullets. Price-based purchasing for commodity products, with suppliers competing, is the many-suppliers description. Few-suppliers also notes JIT participation, design expertise, and that trade secrets may be at risk.","explainWrong":{"0":"That is the many-suppliers description.","2":"The few-suppliers slide says suppliers are more willing to participate in JIT programmes and contribute design and technological expertise.","3":"The slide says trade secrets and other alliances may be at risk."}},{"id":"scm-m3","topic":"scm","bank":"mock","type":"mc","stem":"Walmart’s own trucking fleet and numerous U.S. distribution centers, used to find alternative origins and delivery routes, is Table 11.3’s example for:","options":["Political risk","Logistics delays or damage","Supplier quality failures","Information loss or distortion"],"answer":1,"explainRight":"Logistics delays or damage: tactics include multiple/redundant transportation modes and warehouses, secure packaging, and effective contracts with penalties. The example is Walmart, with its own trucking fleet and numerous distribution centers, finding alternative origins and delivery routes that bypass problem areas.","explainWrong":{"0":"Political risk is illustrated with Hard Rock Café franchising and licensing.","2":"Supplier quality failures is illustrated with Darden Restaurants (including third-party audits).","3":"Information loss or distortion is illustrated with Boeing’s international communication system."}},{"id":"qm-d1","topic":"qm","bank":"diagnose","type":"mc","stem":"The lecture names three views of quality. They are:","options":["Prevention, appraisal and internal failure only","User based, manufacturing based, and product based","Short-range, medium-range and long-range","Process focus, product focus and repetitive focus"],"answer":1,"explainRight":"User based: better performance, more features. Manufacturing based: conformance to standards, making it right the first time. Product based: specific and measurable attributes of the product.","explainWrong":{"0":"Those are three of the four costs of quality, not the three views of quality.","2":"Those are forecasting (and, separately, capacity) time horizons.","3":"Those are process strategies, not views of quality."}},{"id":"qm-d2","topic":"qm","bank":"diagnose","type":"mc","stem":"Which of the following is the lecture definition of appraisal costs?","options":["Reducing the potential for defects","Evaluating products, parts, and services","Producing defective parts or service before delivery","Defects discovered after delivery"],"answer":1,"explainRight":"Appraisal costs — evaluating products, parts, and services. Prevention is reducing the potential for defects; internal failure is producing defective parts or service before delivery; external failure is defects discovered after delivery.","explainWrong":{"0":"That is prevention costs.","2":"That is internal failure costs.","3":"That is external failure costs."}},{"id":"qm-d3","topic":"qm","bank":"diagnose","type":"tf","stem":"The lecture states that 85% of quality problems are due to materials and process.","options":["True","False"],"answer":0,"explainRight":"That sentence is on the employee-empowerment slide, which is about getting employees involved in product and process improvements.","explainWrong":{"1":"The lecture states the 85% figure in those words."}},{"id":"qm-d4","topic":"qm","bank":"diagnose","type":"mc","stem":"In the lecture’s PDCA cycle, “Do” is worded as:","options":["Identify the problem and make a plan","Test the plan","Is the plan working?","Implement the plan, document"],"answer":1,"explainRight":"Figure 6.3, wording as printed: Plan — Identify the problem and make a plan. Do — Test the plan. Check — Is the plan working? Act — Implement the plan, document.","explainWrong":{"0":"That is Plan.","2":"That is Check.","3":"That is Act."}},{"id":"qm-p101","topic":"qm","bank":"practise","type":"tf","stem":"An operations manager’s objective, the lecture says, is to build a total quality management system that identifies and satisfies customer needs.","options":["True","False"],"answer":0,"explainRight":"That is the opening definition on the “defining quality” slides.","explainWrong":{"1":"That is the lecture statement of the operations manager’s quality objective."},"level":1},{"id":"qm-p102","topic":"qm","bank":"practise","type":"mc","stem":"A “manufacturing based” view of quality, as defined in the lecture, emphasises:","options":["Better performance and more features","Conformance to standards, making it right the first time","Only specific and measurable attributes of the product, with no mention of conformance","Appointment scheduling in a clinic"],"answer":1,"explainRight":"Manufacturing based: conformance to standards, making it right the first time. User based: better performance, more features. Product based: specific and measurable attributes of the product.","explainWrong":{"0":"That is the user-based view.","2":"Specific and measurable attributes is the product-based view. Manufacturing based is about conformance and doing it right the first time.","3":"Appointments are a service demand-management method in the capacity lecture."},"level":1},{"id":"qm-p103","topic":"qm","bank":"practise","type":"mc","stem":"External failure costs are defined in the lecture as:","options":["Reducing the potential for defects","Evaluating products, parts, and services","Producing defective parts or service before delivery","Defects discovered after delivery"],"answer":3,"explainRight":"External failure costs — defects discovered after delivery. Internal failure is the same idea before delivery.","explainWrong":{"0":"That is prevention costs.","1":"That is appraisal costs.","2":"That is internal failure costs (before delivery)."},"level":1},{"id":"qm-p104","topic":"qm","bank":"practise","type":"tf","stem":"Managing quality, the lecture says, supports differentiation, low cost, and response strategies, and quality helps firms increase sales and reduce costs.","options":["True","False"],"answer":0,"explainRight":"Those are the quality-and-strategy bullets, alongside a figure on two ways quality improves profitability (sales gains and reduced costs).","explainWrong":{"1":"The lecture states both points."},"level":1},{"id":"qm-p201","topic":"qm","bank":"practise","type":"mc","stem":"A bakery finds a burnt batch still on the cooling rack, before any loaf is sold. In the lecture’s cost-of-quality language, that is closest to:","options":["Prevention costs","Appraisal costs","Internal failure costs","External failure costs"],"answer":2,"explainRight":"Internal failure costs are producing defective parts or service before delivery. External failure would be defects discovered after delivery (for example a customer complaint about a burnt loaf already sold). Prevention is reducing the potential for defects; appraisal is evaluating products, parts and services.","explainWrong":{"0":"Prevention is about reducing the potential for defects, not about a defect already produced.","1":"Appraisal is evaluating products, parts and services (inspection and similar activity), not the cost of a defect already made.","3":"External failure is after delivery."},"level":2},{"id":"qm-p202","topic":"qm","bank":"practise","type":"mc","stem":"In the lecture’s PDCA wording, “Act” is:","options":["Identify the problem and make a plan","Test the plan","Is the plan working?","Implement the plan, document"],"answer":3,"explainRight":"Act — “Implement the plan, document.” The four steps, as printed: Plan, Do, Check, Act, with the wordings above.","explainWrong":{"0":"That is Plan.","1":"That is Do.","2":"That is Check."},"level":2},{"id":"qm-p203","topic":"qm","bank":"practise","type":"tf","stem":"Kaizen, in the lecture, describes the ongoing process of unending improvement, and TQM and zero defects are also used to describe continuous improvement.","options":["True","False"],"answer":0,"explainRight":"Those sentences are on the continuous-improvement slide, which also says it is a never-ending process covering people, equipment, suppliers, materials and procedures, and that every operation can be improved.","explainWrong":{"1":"That is the lecture wording."},"level":2},{"id":"qm-p204","topic":"qm","bank":"practise","type":"mc","stem":"Just-in-time (JIT), as explained in the quality lecture, is a:","options":["Push system that always maximises inventory so that problems stay hidden","‘Pull’ system of production scheduling, including supply management, with production only when signalled","Qualitative forecast used for facility location","Type of external failure cost"],"answer":1,"explainRight":"JIT is a “pull” system of production scheduling including supply management; production only when signalled; it allows reduced inventory levels. The slide also says inventory costs money and hides process and material problems, and that JIT encourages improved process and product quality.","explainWrong":{"0":"The lecture describes a pull system that allows reduced inventory; it says inventory hides process and material problems, which is the opposite of “maximise inventory so problems stay hidden”.","2":"Facility location is a use of long-range forecasts, not a JIT definition.","3":"External failure is a cost of quality, not a description of JIT."},"level":2},{"id":"qm-p301","topic":"qm","bank":"practise","type":"tf","stem":"Inspection, the lecture says, involves examining items to see if an item is good or defective; it detects a defective product, does not correct deficiencies in process or product, and is expensive.","options":["True","False"],"answer":0,"explainRight":"Those are the inspection-slide bullets.","explainWrong":{"1":"The lecture states each of those points."},"level":3},{"id":"qm-p302","topic":"qm","bank":"practise","type":"mc","stem":"Which of the following is one of the seven when/where inspection points listed in the lecture?","options":["Only after the product has been scrapped, and at no earlier stage","At the supplier’s plant while the supplier is producing","In the Delphi panel, before any process exists","As a substitute for a mission statement"],"answer":1,"explainRight":"The seven points are: (1) at the supplier’s plant while the supplier is producing; (2) at your facility upon receipt of goods from your supplier; (3) before costly or irreversible processes; (4) during the step-by-step production process; (5) when production or service is complete; (6) before delivery to your customer; (7) at the point of customer contact. When and where depends on the type of process and the value added at each stage.","explainWrong":{"0":"The list includes several earlier points, including at the supplier’s plant and on receipt, not only after scrap.","2":"Delphi is a forecasting method, not an inspection point.","3":"Inspection is not described as a substitute for the mission."},"level":3},{"id":"qm-p303","topic":"qm","bank":"practise","type":"mc","stem":"Poka-yoke, in the lecture, is:","options":["The concept of foolproof devices or techniques designed to pass only acceptable products","A type of external failure after delivery","A long-range capacity option for acquiring competitors","A many-suppliers purchasing rule"],"answer":0,"explainRight":"“Poka-yoke is the concept of foolproof devices or techniques designed to pass only acceptable products.” The same slides say checklists ensure consistency and completeness, and that source inspection is also known as source control.","explainWrong":{"1":"External failure is a cost of quality (defects discovered after delivery), not poka-yoke.","2":"Acquiring competitors is a long-range capacity option.","3":"Many-suppliers is a sourcing strategy."},"level":3},{"id":"qm-p304","topic":"qm","bank":"practise","type":"tf","stem":"Six Sigma, benchmarking and Taguchi concepts are named on the “seven concepts of TQM” list, but they are not explained further in the uploaded slides.","options":["True","False"],"answer":0,"explainRight":"The seven concepts are: continuous improvement; Six Sigma; employee empowerment; benchmarking; just-in-time (JIT); Taguchi concepts; and knowledge of TQM tools. In this deck, Six Sigma, benchmarking and Taguchi concepts are not developed further. This tool does not invent those definitions.","explainWrong":{"1":"That is an accurate account of the uploaded lecture."},"level":3,"flag":"Check with your lecturer if Six Sigma, benchmarking or Taguchi concepts are taught from the textbook or another handout — they are not explained in the uploaded slides."},{"id":"qm-p401","topic":"qm","bank":"practise","type":"mc","stem":"On the TQM-tools slide, a Pareto chart and a flowchart (process diagram) are grouped as:","options":["Tools for generating ideas","Tools to organize the data","Tools for identifying problems","Costs of quality"],"answer":1,"explainRight":"Tools for generating ideas: check sheet; scatter diagram; cause-and-effect diagram. Tools to organize the data: Pareto chart; flowchart (process diagram). Tools for identifying problems: histogram; statistical process control chart. The slides name these tools and do not work examples or calculations.","explainWrong":{"0":"Generating ideas: check sheet, scatter diagram, cause-and-effect diagram.","2":"Identifying problems: histogram and statistical process control chart.","3":"The costs of quality are prevention, appraisal, internal failure and external failure."},"level":4},{"id":"qm-p402","topic":"qm","bank":"practise","type":"mc","stem":"Which of the following is listed as an employee-empowerment technique?","options":["Move responsibility to employees","Always keep responsibility away from employees","Replace PDCA with a naive forecast","Outsource inspection only, and never build communication networks"],"answer":0,"explainRight":"Techniques listed: build communication networks that include employees; develop open, supportive supervisors; move responsibility to employees; build a high-morale organization; create formal team structures. The same slide says 85% of quality problems are due to materials and process.","explainWrong":{"1":"The lecture says the opposite: move responsibility to employees.","2":"PDCA is the continuous-improvement cycle; a naive forecast is a forecasting method.","3":"Building communication networks that include employees is one of the listed techniques."},"level":4},{"id":"qm-p403","topic":"qm","bank":"practise","type":"mc","stem":"The lecture’s two ways quality improves profitability include sales gains and reduced costs. Sales gains are listed as coming via:","options":["Increased productivity, lower rework and scrap costs, and lower warranty costs only","Improved response, flexible pricing, and an improved reputation","Only a higher utilization ratio, with no sales effects named","A long-range forecast of facility location only"],"answer":1,"explainRight":"Sales gains via improved response, flexible pricing, and improved reputation. Reduced costs via increased productivity, lower rework and scrap costs, and lower warranty costs. Together these feed improved quality and increased profits.","explainWrong":{"0":"Those are the reduced-cost routes, not the sales-gains routes.","2":"The slide lists sales-gain routes (response, flexible pricing, reputation) as well as cost routes. Utilization is a capacity measure, not the heading here.","3":"Facility location is a use of long-range forecasts, not the quality-and-profit figure."},"level":4},{"id":"qm-p404","topic":"qm","bank":"practise","type":"mc","stem":"Source inspection, in the lecture, is also known as:","options":["Source control, with the next step in the process treated as your customer","Design capacity","A keiretsu network","Exponential smoothing"],"answer":0,"explainRight":"Source inspection is “also known as source control”. The next step in the process is your customer; the aim is to ensure a perfect product to your customer. Checklists ensure consistency and completeness.","explainWrong":{"1":"Design capacity is the maximum theoretical output of a system.","2":"Keiretsu networks are a named, unexplained sourcing strategy.","3":"Exponential smoothing is a named, unformulated forecasting method."},"level":4},{"id":"qm-m1","topic":"qm","bank":"mock","type":"mc","stem":"A customer finds a defect after a product has already been delivered. In the lecture’s cost-of-quality language, that is:","options":["Prevention costs","Appraisal costs","Internal failure costs","External failure costs"],"answer":3,"explainRight":"External failure costs are defects discovered after delivery. Internal failure is producing defective parts or service before delivery.","explainWrong":{"0":"Prevention is reducing the potential for defects.","1":"Appraisal is evaluating products, parts and services.","2":"Internal failure is before delivery."}},{"id":"qm-m2","topic":"qm","bank":"mock","type":"mc","stem":"In the lecture’s PDCA cycle, “Plan” is worded as:","options":["Identify the problem and make a plan","Test the plan","Is the plan working?","Implement the plan, document"],"answer":0,"explainRight":"Plan — “Identify the problem and make a plan.” Do — “Test the plan.” Check — “Is the plan working?” Act — “Implement the plan, document.”","explainWrong":{"1":"That is Do.","2":"That is Check.","3":"That is Act."}},{"id":"qm-m3","topic":"qm","bank":"mock","type":"tf","stem":"Inspection detects a defective product; the lecture says it does not correct deficiencies in process or product.","options":["True","False"],"answer":0,"explainRight":"Those two bullets appear together on the inspection slide, which also says inspection is expensive.","explainWrong":{"1":"The lecture states this explicitly."}}]};
(function () {
  "use strict";

  var STORE = "aolm-study-progress-v1";
  var MOCK_SECONDS = 25 * 60;
  var live = document.getElementById("live");
  var state = loadState();
  var mockTick = null;

  function defaultState() {
    return {
      view: "home",
      topicId: null,
      level: null,
      qIndex: 0,
      diagnose: { index: 0, answers: {}, finished: false },
      practise: {},
      mock: { started: false, remaining: MOCK_SECONDS, answers: {}, submitted: false, order: [] },
      lessonsSeen: {}
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return defaultState();
      var s = JSON.parse(raw);
      var d = defaultState();
      Object.keys(d).forEach(function (k) {
        if (s[k] !== undefined) d[k] = s[k];
      });
      return d;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
    } catch (e) { /* private mode etc. */ }
  }

  function announce(msg) {
    if (live) live.textContent = msg;
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "className") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "html") n.innerHTML = v;
        else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
        else if (k === "checked" || k === "disabled") n[k] = !!v;
        else n.setAttribute(k, v === true ? "" : String(v));
      });
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  function topicById(id) {
    for (var i = 0; i < DATA.topics.length; i++) if (DATA.topics[i].id === id) return DATA.topics[i];
    return null;
  }

  function qsFor(topicId, bank) {
    return DATA.questions.filter(function (q) {
      return q.topic === topicId && q.bank === bank;
    });
  }

  function practiseQs(topicId, level) {
    return DATA.questions.filter(function (q) {
      return q.topic === topicId && q.bank === "practise" && q.level === level;
    });
  }

  function diagnoseQs() {
    var out = [];
    DATA.topics.forEach(function (t) {
      qsFor(t.id, "diagnose").forEach(function (q) { out.push(q); });
    });
    return out;
  }

  function rating(correct, total) {
    if (total <= 0) return "notyet";
    if (correct >= 3) return "strong";
